# Process source for Colorimetric Readout.
#
# Signature read from the page, and from the steps that run it where any do.
#
# IT IS THE STAGE, NOT THE CHEMISTRY. The page: it "converts a completed sensing/lysis
# cascade into a visible, measurable color signal", with CPRG or an alternate substrate.
# ../color-development is the step that does it on a specific cascade; this is the
# abstract readout every cascade ends at.
#
# NO MODULE STEP NAMES IT, which is why it has no `refines:` and nothing refines it:
# the relation would be the other way round and ../color-development does not declare
# it. Left undeclared rather than guessed.

process: colorimetric-readout
title: "Colorimetric Readout"

signature:
  takes:
    - type: cascade
      note: >
        A completed sensing and lysis cascade.
    - type: substrate
      note: >
        The chromogenic substrate the reporter enzyme turns over. CPRG is attested; the
        page names an alternate.
  produces:
    type: measurement
    note: >
      A visible color change, read. RULED 2026-10-05: "colormetric readout should also
      produce measurement; signal is the output of a detector's function and a required
      input for an effector module."
      SO SIGNAL AND MEASUREMENT ARE TWO THINGS AND THIS PRODUCES THE SECOND. A Signal is
      what a Detector emits and what an Effector consumes -- it sits mid-cascade, in
      both a codomain and a domain. A Measurement is where the chain stops and a reader
      takes a number. This process is the stop.

open:
  - id: a-readout-does-not-produce-a-component
    question: >
      PARTLY SETTLED 2026-10-05. This produces a `measurement`, ruled, which is the same
      codomain as ../pierce660 and ../protein-gel -- so the three readouts agree and the
      `observe` abstract they imply has one word to inherit rather than two.
      WHAT IS STILL OPEN IS THE WORD ITSELF, and it is cross-repo. This corpus writes
      `measurement`; compositional-biology-theory has `Observation` as the type row with
      `glossary.md#T36` making Readout a synonym for Measurement. Jon used
      "measurement". Neither session has normalised, because picking a cross-repo word
      unilaterally is the thing both agreed not to do.
      AND SIGNAL IS NOT IN THE RUNNING ANY MORE, which is the useful half: it is a
      different type, consumed by an Effector rather than read by a person. The theory
      side measured that Signal, Color and Observation appear in 5 codomain positions
      and 0 domain positions across every profile they have, so the operation an
      Effector performs on a Signal is unwritten there too.
