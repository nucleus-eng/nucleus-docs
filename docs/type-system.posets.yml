    set, so it is a different relation from module_refinement even where names coincide
not_orders:
- name: operator
  why: a flat two-value enum; two incomparable values order nothing
- name: process.composed_of
  why: a sequence in time, not refinement
- name: measured_by / sensitivities / impositions / requires
  why: relations, not orders; nothing here is transitive
- name: validation stars
  why: ranks our confidence in a page, not the corpus
