name: Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "styles/**"
      - "tests/**"
      - ".vale.ini"
      - "requirements.txt"
      - ".github/workflows/style-tests.yml"

jobs:
  style-tests:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: "3.14.2"
    steps:
      - uses: actions/checkout@v4

      - name: Install Vale
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar xz -C /usr/local/bin vale

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # `pytest -v`, not the Vale fixtures alone: this runs the WHOLE suite, 422
      # tests. It was called "Vale Style Tests" until 2026-10-07, which is why a
      # biopython failure in tests/test_protein_refs.py read as a styling problem
      # and stayed red for four days.
      - name: Run the test suite
        run: pytest -v
