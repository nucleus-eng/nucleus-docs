# VENDORED, and generated before that. Do not edit this file, and do not edit the
# copy in nucleus-skills either — both come from one table in the glossary.
#
# Source  nucleus-eng/nucleus-skills, branch main,
#         af8ebb6f1d60e6898070f64ceed72964de88db07
#         plugins/nucleus/references/glossary.md, section "Refused spellings"
#
# To change a rule: edit the glossary row there, run scripts/generate-vale-rules.py,
# copy the result here, and move the hash above.
#
# No level is set here. Severity is this repo's, and .vale.ini sets it — every rule
# warns, because new terms flow in from DevNotes and blocking the source would stop
# the glossary growing.
extends: existence
message: "Name the class — GUV, SUV or LUV — rather than '%s' (Nucleus glossary, narrows)."
ignorecase: true
exceptions:
  - 'Multilamellar vesicle'
  - 'Multilamellar vesicles'
  - 'Unilamellar vesicle'
  - 'Unilamellar vesicles'
  - 'multilamellar vesicle'
  - 'multilamellar vesicles'
  - 'unilamellar vesicle'
  - 'unilamellar vesicles'
tokens:
  - '[A-Za-z]+lamellar vesicles?'
  - 'vesicles?'
