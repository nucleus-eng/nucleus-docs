# Composition source for the Cell: Base Cytosol, POPC/Chol (9:1).
#
# Machine-readable companion to spec.md — see issue #248. The `# Constituent
# Modules` prose stays for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# Depth 1. Both constituents are obtained.

module: cell-base-cytosol-popc-chol
title: "Cell: Base Cytosol, POPC/Chol (9:1)"
refines:
  - cell
  - guv
  - liposome
  # `liposome` ADDED 2026-10-05, the material axis. Jon: "synthetic cells should
  # refine liposomes, as should any of the substrate vesicles and dye vesicles (by
  # virtue of the fact that they are built from lipids)". Verified for this Module:
  # its membrane operand is a POPC bilayer. The size axis above and this one do not
  # nest -- ../vesicle/spec.md: "A GUV may be a liposome or a polymersome".
  # GUV appended 2026-10-04: the class is determined by the process that
  # produces this page, and that is Encapsulation: Phase Transfer. It is LAST because
  # the first entry is the alignment parent and must be the FUNCTIONAL one;
  # size is form, not function.
# A CHASSIS IS A CELL, and that is not a judgment
# call: this Module's final step is `encapsulate`, `packing`, over exactly two operands,
# a cytosol and a membrane, which is ../cell/spec.yml's invariant with no exception.
# base-cell, cell-base-cytosol-popc-chol and cell-s30-popc are the same step over the same sorts.
#
# IT SITS UNDER Cell RATHER THAN UNDER Sensing Cell BECAUSE ITS CYTOSOL CARRIES NO
# DETECTOR. That is what makes the Sensing Cell refinement a narrowing of one slot, and
# there are three such controls rather than one.

inputs:
  outer-solution:
    title: "Outer solution"
    # THE CLASS AND NOT A MEMBER, deliberately. Which outer solution is the
    # implementation's choice -- the same reason `total_volume` is an Implementation
    # fact under R37 -- and an operand naming a class means any member satisfies it.
    # ../craic-cascade/spec.yml already did this; it was the only one.
    page: ../outer-solution/spec.md
  base-cytosol:
    title: "Base Cytosol"
    page: ../base-cytosol/spec.md
  membrane-popc-chol-9-1:
    title: "Membrane: POPC/Chol (9:1)"
    page: ../membrane-popc-chol-9-1/spec.md

process_steps:
  - id: encapsulate
    process:
      title: "Encapsulation: Phase Transfer"
      page: ../../processes/assemble-base-cell/main.md
      abstract: encapsulate
    operator: packing
    # THE THIRD ARGUMENT, added 2026-10-05 under C1's ruled signature:
    #   encapsulate : membrane_components, inner_solution, outer_solution
    #                   -> outer_solution{Membrane[membrane_components]{inner_solution}}
    # The product's TYPE names what it is suspended in, so a step that leaves it out
    # describes a compartment hanging in nothing. 23 of 26 encapsulation steps did.
    operands: [base-cytosol, membrane-popc-chol-9-1, outer-solution]
    produces:
      id: cell-base-cytosol-popc-chol
      title: "Cell: Base Cytosol, POPC/Chol (9:1)"
      page: ../cell-base-cytosol-popc-chol/spec.md
    parameters:
      # MOVED HERE 2026-10-03 from the Preparations table on
      # ../membrane-popc-chol-9-1/spec.md, which keyed its rows by the Modules
      # that take the membrane. The membrane is 89.9/10/0.1 mol% whoever takes it;
      # the volumes are this chassis's dose of it, at 0.5 mM total lipid.
      #
      # THE THREE LIPID ROWS ARE REMOVED 2026-10-05 AS FULLY REDUNDANT. Their stocks
      # are the same three now on ../membrane-popc-chol-9-1/spec.yml's inputs, and
      # their volumes follow from that page's 89.9 / 10 / 0.1 mol% by
      # mol% x molar_mass / stock -- measured, and it returns 41, 1.16 and 1.953
      # against the 41, 1.16 and 1.952 written here. Nothing was lost.
      #
      # `total_lipid` STAYS, because it is this chassis's dose and the membrane page
      # cannot state it: the membrane is 89.9/10/0.1 whoever takes it, and 0.5 mM is
      # what THIS cell takes.
      total_lipid: "0.5 mM"
    notes: >
      The empty chassis — Base Cytosol with no sensing payload, closed in a 9:1
      POPC:cholesterol bilayer. The sensing cells built on this membrane are
      siblings of this Module rather than things made from it: each packs its
      own sensor cytosol in the same membrane, and a cytosol cannot be added to
      an already-closed chassis.
