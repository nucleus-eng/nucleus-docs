# Process source for Make Small Molecule Mix.
#
# Signature read from the page, and from the steps that run it where any do.
#
# A REAGENT PREPARATION. It makes a constituent of ../../modules/base-cytosol rather
# than a Module anybody encapsulates, which is why no module step names it: the corpus
# documents how to make the cytosol's parts and then treats the cytosol as bought.
#
# What it makes is Small Molecule Mix, the Module at ../../modules/smix, whose own
# source takes this process as the step that makes it.

process: make-small-molecule-mix
title: "Make Small Molecule Mix"
refines: prepare

signature:
  takes:
    - type: Component
      repeated: true
      note: >
        Thirty-one small molecules -- rNTPs, amino acids, buffering salts -- that fuel transcription and translation.
  produces:
    type: Component
    note: >
      Small Molecule Mix. One of the three things ../assemble-base-cytosol mixes.

operator: mixing
