# Process source for Make Protein Mix (36-pot).
#
# Signature read from the page, and from the steps that run it where any do.
#
# A REAGENT PREPARATION. It makes a constituent of ../../modules/base-cytosol rather
# than a Module anybody encapsulates, which is why no module step names it: the corpus
# documents how to make the cytosol's parts and then treats the cytosol as bought.
#
# `produces: component` RATHER THAN A NAMED TYPE, because the thing it makes has no
# module page. That is the honest shape and it is also the finding: this process's
# output is an input id on ../assemble-base-cytosol's step and nothing else.

process: make-36pot
title: "Make Protein Mix (36-pot)"
# A COMPOSITE REFINES `make`, 2026-10-19. This runs other Processes in order,
# assembling AND running, so it spans the bench route and the function route and
# its parent sits above both. `make` is that parent: what it produces is in the
# result and was not in the domain.
#
# It read "A COMPOSITE REFINES NOTHING ... and `make` is not a Process" from
# 2026-10-12 until 2026-10-19. No node then sat above both routes, and that gap
# in the order was read as a fact about the composite.
refines: make

signature:
  takes:
    - type: Component
      repeated: true
      note: >
        Thirty-six proteins, purified individually.
  produces:
    type: Component
    note: >
      Protein Mix. With Small Molecule Mix it implements ../../modules/base-cytosol/spec.md.

operator: mixing
