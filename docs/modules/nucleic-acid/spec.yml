# Composition source for Nucleic Acid.
#
# DNA AND RNA REFINE NUCLEIC ACID, and both names are written all caps in every title,
# table cell and sentence on this page and on the two below it. The ids cannot carry
# capitals, because the schema's id pattern is `^[a-z0-9]+(-[a-z0-9]+)*$`, so
# `nucleic-acid`, `dna` and `rna` are slugs and `Nucleic Acid`, `DNA` and `RNA` are what
# a reader sees.
#
# IT JOINS TWO ROOTS THAT WERE UNRELATED. ../dna and ../rna each refined nothing and
# sat side by side with no stated relation, while the corpus's own condition ids already
# carried that relation one level down: `rna-nucleolysis` refines `nucleolysis`. A
# corpus cannot say the conditions are related and the things they act on are not.
#
# GROUNDED BY COMPOSITION, as ../protein and ../dna are. Every member is a chain of
# nucleotides joined by a phosphodiester backbone. What varies below this page is the
# sugar, which is what separates ../dna from ../rna, and then the strand count, which is
# what separates ../dsdna from ../ssdna.
#
# `inputs: {}` AND `process_steps: []` ARE CLAIMS, inherited from ../dna's reasoning and
# true here for the same reason. Nothing in this corpus produces a nucleic acid as a
# step. Templates are supplied and transcripts are read rather than written down.
#
# A CORRECTION TO ../dna/spec.yml AS WRITTEN EARLIER TODAY. That file said `nucleolysis`
# "this corpus already uses as a condition id". It did not. `grep -rn nucleolysis docs`
# returned `rna-nucleolysis` on ../rna and that sentence, and nothing else. The parent
# condition was named only in prose about the gap, so declaring the sensitivity below is
# the first time this corpus writes it. The note on ../dna is fixed in the same commit.

module: nucleic-acid
title: "Nucleic Acid"

inputs: {}
process_steps: []

# THE SENSITIVITY IS THE ABSTRACT ONE, AND THAT IS WHAT THIS PAGE IS FOR. ../rna
# declares `rna-nucleolysis` and ../dna declares nothing. The claim here is weaker than
# either and holds over both: a phosphodiester backbone is what a nuclease cuts, so
# every member has a nuclease.
#
# THE REASON ../dna DECLARES NOTHING IS NOT THAT NOTHING ATTESTS A DNase. It said that
# until 2026-10-08 and it was wrong: ../s30-lysate attests one, at its `spec.md:88`, and
# now declares `degrade[linearDNA]`. The reason is that the attested activity is
# EXONUCLEASE -- it needs a free end, so a linear template is degraded and a circular
# one is spared -- so it is not a property of DNA as such. **The restriction lives in
# the bracket rather than in prose**, which is the shape `degrade[ssrA]` already uses
# for ClpXP acting only on tagged proteins. So no module for linear DNA is needed: the
# predicate goes on the operation. The refusal stands; the reason given for it did not.
#
# IT DOES NOT PUSH A DNase CLAIM ONTO ../dna. The refusal recorded there was to invent a
# specific DNase sensitivity with no attested member. This is the function, not an
# implementer, and `rna-nucleolysis` refines it. The DNA-side narrowing stays unwritten
# until a member attests one.
#
# `basis: rule` FOR THE SAME REASON ../protein/spec.yml USES IT. The mechanism is why
# the claim generalizes to members nobody has tested. The attestation this corpus holds
# is 14 sources adding an RNase inhibitor, which is strong evidence that the claim is
# uncontroversial and no evidence at all for a bound. So no bound is asserted.
sensitivities:
  - id: nucleolysis
    to: nucleolysis
    basis: rule
    why: >
      A phosphodiester backbone is what a nuclease cleaves, and every member has one.
      Which nuclease reaches which member is the narrowing a child declares:
      `rna-nucleolysis` refines this, and the DNA-side counterpart is unwritten because
      no member of DNA attests one.
    page: spec.md
