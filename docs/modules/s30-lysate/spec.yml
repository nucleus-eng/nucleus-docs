module: s30-lysate
title: "S30 Lysate"
refines: cytosol

inputs:
  s30-premix:
    title: "S30 premix"
    page: null
    component_of: "Promega E. coli S30 Extract System for Circular DNA, L1020"
  s30-extract:
    title: "S30 extract"
    page: null
    component_of: "Promega E. coli S30 Extract System for Circular DNA, L1020"
  amino-acid-mix:
    title: "Amino acid mix (pooled)"
    page: null
    component_of: "Promega E. coli S30 Extract System for Circular DNA, L1020"
  rnase-inhibitor:
    title: "RNase inhibitor"
    page: null

provides:
  - id: transcribe[sigma70]
    why: >
      Carries E. coli's own RNA polymerase, so it transcribes a template driven by a
      σ70 promoter. It does not transcribe a T7-driven one.
    page: spec.md
  # THE COMPOSITION IS UNDEFINED, SO THESE NAME A FUNCTION AND NEVER AN ENZYME. This is
  # a commercial lysate; `spec.md:16` says its composition is undefined. All that can be
  # claimed is that it holds SOME composition implementing these, which is exactly what
  # `provides:` is for -- it states what a Module does, not what it contains. No page
  # here names a protease, an RNase or a DNase, and none should.
  - id: degrade[Protein]
    why: >
      Baseline protease activity, from an E. coli extract. The enzyme is not named
      anywhere, and cannot be: the composition is undefined.
    page: spec.md
  - id: degrade[RNA]
    why: >
      Baseline RNase activity, which is why an RNase inhibitor is a Requirement here.
    page: spec.md
  - id: degrade[linearDNA]
    why: >
      Baseline exonuclease activity. The bracket is a PREDICATE OVER DNA and not a
      narrower type, in the same shape as `degrade[ssrA]`, which is ClpXP acting only on
      proteins carrying the tag. An exonuclease needs a free end, so a linear template is
      degraded and a circular one is spared -- which is why this Module requires circular
      DNA, at `spec.md:88`. Declaring `degrade[NucleicAcid]` would overclaim: it does not
      degrade a circular template, and the restriction belongs in the type rather than in
      prose nobody's checker reads.
    page: spec.md

process_steps:
  - id: assemble-s30-lysate
    process:
      title: "Assemble S30 Lysate"
      page: null
      abstract: assemble-cytosol
    operator: mixing
    operands: [s30-premix, s30-extract, amino-acid-mix, rnase-inhibitor]
    produces:
      id: s30-lysate
      title: "S30 Lysate"
      page: ../s30-lysate/spec.md
    headroom:
      provides: "3.75 uL of 25"
      balance: "Nuclease-free water, to 25"
      notes: >
        The four kit and inhibitor volumes come to 21.25 uL and water makes the
        reaction up to 25 uL. The slot is implied by the total rather than named,
        and a DNA template spends part of it.
    notes: >
      The kit is supplied premixed rather than formulated from individual
      reagents, so the three kit components have no pages of their own.

# WHAT THIS MODULE IS SUBJECT TO, and only that half. Sensitivity is a property of an
# object and Imposition a property of a morphism, so an imposition sits on a step. A
# Conflict is derived from the two and is computed, never asserted. check-conflicts.py
# does the computing.
sensitivities:
  - id: optiprep-above-5-percent
    to: optiprep-above-5-percent
    basis: rule
    why: >
      Not compatible with Optiprep in the inner solution above about 5 percent. Use sucrose
      for density matching instead.
