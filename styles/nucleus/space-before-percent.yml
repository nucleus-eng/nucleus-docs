# VENDORED. Do not edit this file here. Edit it in nucleus-skills and copy it back,
# or this repo and the DevNote repo will drift apart on one rule and nothing will say so.
#
# Source  nucleus-eng/nucleus-skills, main, 3137b4c
#         plugins/nucleus/references/vale/nucleus/space-before-percent.yml
#
# A SPACE BEFORE THE PERCENT SIGN, NIST SP 811 §7.2: '25 %', not '25%'.
#
# ONE ALTERNATION IN ONE `raw:` ENTRY, NOT TWO ENTRIES. Two list entries made Vale flag
# nothing at all, with no error, on text it should have flagged. Measured on 3.24.0.
#
# WHAT IT SKIPS, and the pattern is shaped to do it because RE2 has no lookbehind. A MyST
# directive option such as `:width: 75%` is not a unit value and a space would break the
# directive, so the character before the number must not be `:`. A link target holding
# `%2C` and an inline code span are never linted by Vale. Without a character before the
# number, only a number at the start of a line can match, and the second alternative
# takes that case.
extends: existence
message: "Add a space before the percent sign per NIST SP 811 §7.2: '%s' should be e.g. '25 %%'."
raw:
  - '[^\s:\d.]\s?\d[\d.]*%|(?:^|\n)\d[\d.]*%'
