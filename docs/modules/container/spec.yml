# Composition source for Container.
#
# AN ABSTRACT MODULE, AND AN EMPTY ONE BY CLAIM. Its invariant is a single operation,
# `hold`, and an operation is not a composition. compositional-biology-theory
# glossary.md#T33 makes a Composition an explicit expression giving an object as a
# combination of others, and nothing gives Container as a combination of anything. So
# `inputs: {}` and `process_steps: []` are both claims here rather than gaps.
#
# ITS MEMBERS ARE NOT ITS CONSTITUENTS. Membrane, the abstract gel and a Substrate row
# the theory names all refine it. Membership is classification, glossary.md#T13;
# constituency is containment, #T34. A class having members does not give it parts.

