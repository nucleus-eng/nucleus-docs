# Composition source for Membrane: POPC/Chol (7:3).
#
# Machine-readable companion to spec.md — see issue #248. The `# Reference
# Composition` table stays for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# The single step is `mixing`, and that is a claim rather than a default. Three lipids
# go into one film and end in one phase; nothing here keeps its own compartment.
# `packing` arises when this membrane closes around a cytosol, which is a step on
# ../base-cell/spec.yml and not here — so this file does not depend on whether forming a
# boundary and holding something in it are one operation, which is unsettled.

module: membrane-popc-chol
title: "Membrane: POPC/Chol (7:3)"
refines: membrane

inputs:
  popc:
    title: "POPC"
    molar_mass: {value: 760.076, unit: "g/mol"}
    stock: {value: 25, unit: "mg/mL"}
    page: null            # 1-palmitoyl-2-oleoyl-glycero-3-phosphocholine; no module page
  cholesterol:
    title: "Cholesterol"
    molar_mass: {value: 386.7, unit: "g/mol"}
    stock: {value: 50, unit: "mg/mL"}
    page: null
  liss-rhod-pe:
    title: "Liss-Rhod PE"
    molar_mass: {value: 1301.71, unit: "g/mol"}
    stock: {value: 1, unit: "mg/mL"}
    page: null            # Lissamine Rhodamine PE, the fluorescent tracer
    optional: true

process_steps:
  - id: form-lipid-film
    process:
      title: "Mix the Membrane Components"
      page: null            # no process page documents film formation on its own
    operator: mixing
    operands: [popc, cholesterol, liss-rhod-pe]
    produces:
      id: membrane-popc-chol
      title: "Membrane: POPC/Chol (7:3)"
      page: ../membrane-popc-chol/spec.md
    # SCALE-FREE, 2026-10-05, under R35. Jon: "if you already have molar ratio, you
    # don't need volume. one already implies the other." MEASURED BEFORE DROPPING
    # THEM: volume is proportional to mol% x molar_mass / stock, and that reproduces
    # all three stated volumes on this page to within a rounding place. So the
    # volumes carried no fact the three lines above do not already carry.
    #
    # `molar_mass` and `stock` moved onto the reagents, by C72: neither varies
    # across the steps that use the lipid, and both are needed to recover a volume.
    finals:
      popc: {value: 70, unit: "mol%"}
      cholesterol: {value: 29.95, unit: "mol%"}
      liss-rhod-pe: {value: 0.05, unit: "mol%"}
    notes: >
      The three percentages are mole fractions of the lipid film, not of the
      finished cell. The page gives stock concentrations and volumes beside them
      because the film is made by pipetting stocks, so the ratio and the recipe
      are both load-bearing and neither is derivable from the other without the
      molecular weights, which is why those are stated too.

open:
  - id: liss-rhod-pe-is-a-tracer
    question: >
      Liss-Rhod PE is marked optional here because it is a fluorescent tracer at
      0.05%, not a structural lipid, and a membrane without it is still this
      Module. The page does not say that. If the Node considers the tracer part
      of the specification rather than an instrument, the `optional` key should
      come off.
  - id: no-page-for-the-lipids
    question: >
      None of the three lipids has a module page, so their figures live here by
      necessity rather than by design. The same is true of the lipids corpus-wide.
      That the lipids have no pages is the finding, not this file's workaround.
