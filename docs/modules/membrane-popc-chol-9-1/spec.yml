# Composition source for Membrane: POPC/Chol (9:1).
#
# Machine-readable companion to spec.md — see issue #248. The `# Reference
# Composition` tabs stay for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# The step is `mixing`: three lipids into one film, ending in one phase. The `packing`
# step is where this membrane closes around a payload, which lives on the consuming page
# and not here — so nothing in this file depends on whether forming a boundary and
# holding something in it are one operation, which is unsettled.
#
# ONE OF THE PAGE'S TWO PREPARATIONS IS HERE AND THE OTHER IS NOT. The schema cannot
# express alternative routes to one Module — two steps producing the same id fail
# validation with [duplicate-id]. The extrusion route is written out in full in the
# questions at the foot of this file, so none of its figures are lost. This is a
# limit of the schema, not a claim about the bench.

module: membrane-popc-chol-9-1
title: "Membrane: POPC/Chol (9:1)"
refines: membrane

inputs:
  popc:
    title: "POPC"
    page: null
  cholesterol:
    title: "Cholesterol"
    page: null
  liss-rhod-pe:
    title: "Liss-Rhod PE"
    page: null
    optional: true        # the page marks this one "(Optional)" in the table itself

process_steps:
  - id: prepare-for-phase-transfer
    process:
      title: "Mix the Membrane Components"
      page: null            # no process page documents film formation on its own
    operator: mixing
    operands: [popc, cholesterol, liss-rhod-pe]
    produces:
      id: membrane-popc-chol-9-1
      title: "Membrane: POPC/Chol (9:1)"
      page: ../membrane-popc-chol-9-1/spec.md
    parameters:
      popc: "89.9% (mol), MW 760.076, 25 mg/mL stock, 41 uL"
      cholesterol: "10% (mol), MW 386.66, 50 mg/mL stock, 1.16 uL"
      liss_rhod_pe: "0.1% (mol), MW 1301.71, 1 mg/mL stock, 1.952 uL"
      total_lipid: "0.5 mM"
    notes: >
      The 0.5 mM total-lipid preparation named in the Preparations tab. The step names
      no downstream route: this film is consumed by all three of them — phase transfer
      by five sources, extrusion by substrate-cprg-suv and freeze-thaw by
      substrate-cprg-luv — and which one takes it is the consumer's business.

open:
  - id: two-recipes-one-product
    kind: choice
    question: >
      The page documents two preparations of this one film and only the first is a
      step above. They are alternatives, not an ordered pair, and the schema has no
      key for "either of these": process_steps is described as "Ordered composition
      steps", and two steps producing the same id fail check-spec-schema.py with
      duplicate-id. Measured, not assumed — it was written both ways and the
      validator rejected the second. The second recipe in full, so nothing is lost —
      operator mixing, POPC and cholesterol only, POPC 25 mg/mL stock at 208.51 uL,
      cholesterol 50 mg/mL stock at 6.00 uL. Every other source in the corpus is
      genuinely sequential, so this is the first case that needs the distinction.
      THIS WAS WRITTEN AS "two routes" AND THAT FRAMING WAS WRONG. The two were
      labeled by the encapsulation route each film later fed — phase transfer and
      extrusion — which made a downstream choice look like a property of the film.
      Encapsulation consumes a membrane and does not produce one, so neither label
      belonged here. What is left is two recipes differing in their proportions,
      which is the real limit and is narrower than it looked.
  - id: dye-differs-between-routes
    question: >
      CLOSED. Liss-Rhod PE is present in the phase-transfer route and absent from the
      extrusion route, and that was read here as optionality depending on the route,
      which the schema cannot state. It is neither: a fluorescent lipid at about
      0.1 mol% is an optional component of ANY lipid membrane, declared on
      ../membrane/spec.yml as `fluorescent-label`, so this Module inherits it. Which
      preparation happens to carry one is a fact about that preparation and not a
      difference between Modules. Kept rather than deleted because the measurement
      behind it is real and the reading was wrong.
  - id: no-page-for-the-lipids
    question: >
      Neither lipid has a module page, so their figures live here by necessity rather
      than by design. The same is true of the lipids corpus-wide.
