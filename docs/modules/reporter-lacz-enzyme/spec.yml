# Composition source, drafted from the page.
# `type:` names the module's own type in the published type order.
# Operators: mixing = one compartment; packing = each keeps its own.

module: reporter-lacz-enzyme
title: "Reporter: LacZ Enzyme"
type: ColorReporter
refines: Protein

inputs:
  beta-galactosidase:
    title: "β-galactosidase, 1000 U/mL stock"
    page: null            # Source organism, manufacturer and part number are open on the page.
  tris-base:
    title: "Tris base, 1 M"
    page: null
  hydrochloric-acid:
    title: "HCl, 37 %"
    page: null
  cprg:
    title: "CPRG, released into the outer solution of the sample"
    page: null            # Supplied by a substrate Module after lysis; see the page.

process_steps:
  - id: prepare-basic-buffer
    process:
      title: "Color Change: Neutralization"
      page: ../../processes/color-change-neutralization/main.md
    operator: mixing
    operands: [tris-base, hydrochloric-acid]
    produces:
      id: basic-buffer
      title: "Basic buffer, pH 9.9"
      page: null

  - id: prepare-enzyme-solution
    process:
      title: "Color Change: Neutralization"
      page: ../../processes/color-change-neutralization/main.md
    operator: mixing
    operands: [beta-galactosidase, basic-buffer]
    produces:
      id: enzyme-solution-3x
      title: "β-galactosidase, 3× solution"
      page: null

  # The enzyme meets its substrate on contact, so this step has no off state of its own.
  # The membrane of the substrate Module supplies it: CPRG is in the outer solution only after lysis.
  - id: develop-color
    process:
      title: "Color Change: Neutralization"
      page: ../../processes/color-change-neutralization/main.md
    operator: mixing
    operands: [enzyme-solution-3x, cprg]
    produces:
      id: lacz-reaction
      title: "LacZ reaction, CPRG to CPR"
      page: null
