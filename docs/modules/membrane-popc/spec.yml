# Composition source for Membrane: POPC.
#
# Machine-readable companion to spec.md — see issue #248. The `# Reference
# Composition` tabs stay for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# The step is `mixing`: lipids into one film, ending in one phase. The `packing` step is
# where this membrane closes around a payload, which lives on the consuming page and not
# here — so nothing in this file depends on whether forming a boundary and holding
# something in it are one operation, which is unsettled.
#
# THE PAGE DOCUMENTS TWO PREPARATIONS AND ONLY ONE IS A STEP. They are mutually
# exclusive by the page's own words and the schema cannot say so; the other is
# written out in full in the questions at the foot of this file. A limit of the
# schema, not a claim about the bench.

module: membrane-popc
title: "Membrane: POPC"
refines: membrane

inputs:
  popc:
    title: "POPC"
    molar_mass: {value: 760.076, unit: "g/mol"}
    stock: {value: 25, unit: "mg/mL"}
    page: null            # bilayer-forming lipid; in every preparation
  dspe-peg2000:
    title: "DSPE-PEG2000"
    molar_mass: {value: 2805.5, unit: "g/mol"}
    stock: {value: 10, unit: "mg/mL"}
    optional: true
    # OPTIONAL. DSPE-PEG2000 is an optional parameter: it does not meaningfully affect
    # the downstream processes using that lipid, only the resulting membrane
    # properties.
    #
    # THAT IS WHAT MAKES ../guv-cprg/spec.md's "100% POPC" TRUE RATHER THAN FALSE. Read
    # as a whole-film composition it contradicts this page's 99.15 : 0.85. Read against
    # the sterol axis, with the PEG optional, it says what it means: no cholesterol.
    # ../../../style-guide/sections.md already carries the rule -- "Optional components
    # do not change a Module's identity."
    page: null            # PEGylated preparation only — see the questions below

process_steps:
  - id: form-pegylated-film
    process:
      title: "Mix the Membrane Components"
      page: null            # no process page documents film formation on its own
    operator: mixing
    operands: [popc, dspe-peg2000]
    produces:
      id: membrane-popc
      title: "Membrane: POPC"
      page: ../membrane-popc/spec.md
    # SCALE-FREE, 2026-10-05, under R36/R37/R38.
    # MEASURED BEFORE DROPPING THE VOLUMES: mol% x molar_mass / stock returns 99.1496
    # and 0.8504 from the two stated volumes, against the 99.15 and 0.85 the page states
    # at spec.md:81 and :86. The page's own figures are what is written below.
    #
    # `target_composition` goes too: `finals` says the same thing in a form a checker
    # reads, which is what N7 asked for.
    finals:
      popc: {value: 99.15, unit: "mol%"}
      dspe-peg2000: {value: 0.85, unit: "mol%"}
    parameters:
      lipid_in_oil: "3 mg/mL"
      total_lipid: "3.36 mg"
    # ONE BATCH, NOT THE BATCH RUN. 320 uL is sourced; the 3.5x multiplier is sourced;
    # 1120 uL is not written because no page states it.
    total_volume: {value: 320, unit: "uL", note: "one batch; this preparation is a 3.5x batch"}
    notes: >
      The PEGylated preparation. DSPE-PEG2000 is a functional addition rather than a
      label — its PEG headgroup gives steric stabilization at the bilayer surface,
      so this membrane behaves differently from plain POPC. The page states the
      recipe reconciles to 99.150 : 0.850 against the stocks, which is why both the
      mole ratio and the pipetting volumes are carried here: neither is derivable
      from the other without the molecular weights.

open:
  - id: two-preparations-are-exclusive
    kind: choice
    question: >
      The page documents two preparations and only the PEGylated one is a step above.
      They are alternatives and the page says so in its own words — "neither
      additional lipid is optional within its own recipe — they are what distinguish
      one preparation from the other, and they have never been combined in one
      membrane." The schema has no key for that. Marking both lipids `optional` would
      assert they can be freely omitted or combined, which the page denies, and two
      steps producing the same id fail check-spec-schema.py with duplicate-id —
      measured on membrane-popc-chol-9-1, not assumed. The missing route in full,
      so nothing is lost — fluorescently labeled membrane, target 99.9 mol% POPC :
      0.1 mol% 18:1 Cyanine 5 PC, POPC 25 mg/mL stock at 79.863 uL, Cyanine 5 PC
      1 mg/mL stock at 3.423 uL, 2.00 mg total lipid, single-batch scale. It is the
      variant gel-embedded in ../../processes/embed-thermal-setting/main.md.
  - id: cyanine-5-stock-is-disputed
    question: >
      The labeled recipe above depends on a stock concentration the page flags as
      disputed and has an open @Editor(london) tag against. One record gives the
      18:1 Cyanine 5 PC stock as 25 mg/mL, which would put the dye at 2.42 mol% —
      about 24x the 0.1 mol% target. The page uses 1 mg/mL because that reconciles
      exactly and matches the dye-stock convention used for Liss-Rhod PE in both
      other Nucleus membranes. This file repeats the page's figure and does not
      resolve the dispute; the resolution is the Node's.
  - id: no-page-for-the-lipids
    question: >
      Neither lipid has a module page, so their figures live here by necessity rather
      than by design. The same is true of the lipids corpus-wide.
