# Composition source for Lysis.
#
# WRITTEN 2026-10-05 under T2. Jon, on the PLA1 ruling: "PLA1 implements lysis and lysis
# imposes on modules in the same compartment." So the imposition is not PLA1's. Lysis
# is the thing that imposes and PLA1 is an implementation of it.
#
# THE IMPOSITION IS DECLARED HERE, which needed a schema key that did not exist until
# 2026-10-05. Jon: "as a class all members impose lysis. so there should be a class
# level imposition i think." `impositions` was a step-only key, on #T22's reading that
# an imposition belongs to a morphism.
#
# BOTH READINGS HOLD AND THEY ARE ABOUT DIFFERENT THINGS. The class says what
# implementing this Function MEANS. The member's step says when it happened. #T22 is
# about the second and this is the first, the same relation ../protein/spec.yml already
# has with its members over `sensitivities`.
#
# SCOPE IS THE COMPARTMENT, NOT THE MEMBRANE, and that is the sentence the class exists
# to hold. A member does not distinguish the membrane that produced it from a
# neighbor's.
#
# ONE MEMBER TODAY. The class is still worth a page: it is where the imposition's scope
# is written down -- the compartment, not the membrane -- and that sentence belongs to
# the kind rather than to the enzyme.

module: lysis
title: "Lysis"

inputs: {}
process_steps: []

impositions:
  - id: lysis
    why: >
      Every member breaks phospholipid membranes in reach. The scope is the compartment
      rather than any one membrane, because a member cannot distinguish the membrane
      that produced it from a neighbor's.
    page: spec.md
