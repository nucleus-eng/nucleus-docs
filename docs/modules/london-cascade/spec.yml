# Composition source for the London Cascade.
#
# Machine-readable companion to spec.md — see issue #248. The `# Constituent
# Modules` prose stays for humans; this file is the contract for tooling.
# Nothing checks that the two agree yet.
#
# Structure confirmed with the London Node, 2026-09-09.

module: london-cascade
title: London Cascade

# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# The operator is determined by the process, not chosen per step. `abstract:`
# names the process this one is an instance of — Assemble Cytosol and Assemble
# Outer Solution are both Assemble Aqueous Solution, which is why both mix.

# Objects the graph names that are not produced by a step here.
# `page: null` means no spec page exists yet — the generator renders the node
# without a click target rather than inventing a link.
inputs:
  s30-lysate:
    title: "Cytosol: S30 Lysate"
    page: ../s30-lysate/spec.md
  detector-3oc6-hsl:
    title: "3OC6-HSL Detector Module"
    page: ../detector-3oc6-hsl/spec.md
  effector-pla1:
    title: "PLA1 Lysis Module"
    page: ../effector-pla1/spec.md
  membrane-popc:
    title: "London Membrane"
    page: ../membrane-popc/spec.md
  substrate-cprg:
    title: "CPRG Substrate"
    page: ../substrate-cprg/spec.md
  reporter-lacz-enzyme:
    title: "LacZ Enzyme"
    page: ../reporter-lacz-enzyme/spec.md
  ulga-powder:
    title: "ULGA powder"
    owner: vendor               # purchased consumable; A5030 vs A2576 is open — see gel-ulga/spec.md
    page: ../gel-ulga/spec.md
  potassium-glutamate:
    title: "Potassium L-glutamate"
    component_of: ../../processes/assemble-outer-solution/main.md
    page: null
  hepes:
    title: "HEPES, pH 7.4"
    component_of: ../../processes/assemble-outer-solution/main.md
    page: null
  glucose:
    title: "Glucose"
    component_of: ../../processes/assemble-outer-solution/main.md
    page: null

process_steps:

  # 1 ────────────────────────────────────────────────────────────────────
  - id: assemble-cytosol
    process:
      title: "Assemble Cytosol"
      page: ../../processes/assemble-cytosol/assemble-cytosol-main.md                    # abstract; no London derivative page yet
      abstract: assemble-aqueous-solution
    operator: mixing
    operands: [s30-lysate, detector-3oc6-hsl, effector-pla1]
    produces:
      id: ahsl-sensor-cytosol
      title: "AHSL Sensor Cytosol"
      page: ../ahsl-sensor-cytosol/spec.md
    notes: >
      S30 Lysate is supplied as a kit, so this is a reconstitution rather than a
      build from a protocol. Its headroom is 3.75 uL of 25, implied by the total
      rather than named — see s30-lysate/spec.md.

  # 2 ────────────────────────────────────────────────────────────────────
  - id: encapsulate-sensing
    process:
      title: "Encapsulation: Phase Transfer"
      page: ../../processes/assemble-base-cell/main.md
    operator: packing
    operands: [ahsl-sensor-cytosol, membrane-popc]
    produces:
      id: ahsl-sensing-cell
      title: "AHSL Sensing Cell"
      page: ../ahsl-sensing-cell/spec.md

  # 3 ────────────────────────────────────────────────────────────────────
  # Same process page as step 2. Two applications, one page — the call-site
  # relationship, not a reason to duplicate the page.
  - id: encapsulate-substrate
    process:
      title: "Encapsulation: Phase Transfer"
      page: ../../processes/assemble-base-cell/main.md
    operator: packing
    operands: [substrate-cprg, membrane-popc]
    produces:
      id: guv-cprg
      title: "GUV: CPRG"
      page: ../guv-cprg/spec.md

  # 4 ────────────────────────────────────────────────────────────────────
  # Same abstract process as step 1 — see `abstract:`. Both are aqueous
  # assembly, so both are mixing.
  - id: assemble-outer-solution
    process:
      title: "Assemble Outer Solution"
      page: ../../processes/assemble-outer-solution/main.md
      abstract: assemble-aqueous-solution
    operator: mixing
    operands: [potassium-glutamate, hepes, glucose]
    produces:
      id: outer-solution-london
      title: "London Outer Solution"
      page: ../outer-solution-london/spec.md
    parameters:
      osmolarity: "~920 mOsm"     # measured or calculated is not recorded in any source
    notes: >
      Matched to the AHSL Sensing Cell inner solution at about 920 mOsm. AHSL is
      excluded — it is the analyte, present in the induced condition only, and
      belongs to the assay rather than the composition.

  # 5 ────────────────────────────────────────────────────────────────────
  - id: embed-ulga
    process:
      title: "Hydrogel Embedding: ULGA"
      page: ../../processes/embed-ulga-hydrogel/main.md
    impositions:
      - id: thermal-hold
        bound:
          quantity: temperature
          sense: at-least
          from: { operand: ulga-powder, key: gel_point_max_c }
        why: >
          The polymer must be liquid when the cells go in, so this step holds them at
          or above its gelling point until the gel sets. THE BOUND IS READ OFF THE
          POLYMER RATHER THAN WRITTEN HERE, which is what lets one embedding process
          carry both agaroses: ULGA holds at 17 °C and LGA at 30 °C. A literal would need one
          step per polymer, and one step per polymer is two processes.
    operator: packing
    operator_pairs:
      - operands: [ulga-powder, outer-solution-london]
        operator: mixing
      - operands: [ulga-powder, reporter-lacz-enzyme]
        operator: mixing
      - operands: [outer-solution-london, reporter-lacz-enzyme]
        operator: mixing
        note: >
          Both share the outer phase and neither carries a boundary, so this
          pair mixes. The step's `packing` label is right for the seven pairs
          that involve a membrane-bounded operand and wrong for these three.
    operands:
      - ulga-powder
      - outer-solution-london
      - reporter-lacz-enzyme
      - ahsl-sensing-cell
      - guv-cprg
    ratio: "1:1:2"                        # sensing cells : substrate cells : gel
    produces:
      id: london-cascade
      title: "London Cascade"
      page: ../london-cascade/spec.md
    notes: >
      One step. The powder is dissolved into the outer solution, the enzyme and
      both cell populations go in, and the gel sets around all of them.

# Not composition steps. Colorimetric Readout measures the result and produces
# no Module, so it is recorded separately rather than as a step above (#228).
measured_by:
  - process:
      title: "Colorimetric Readout"
      page: ../../processes/colorimetric-readout/main.md
