# Composition source for the SensorCell[aTc ⟶ PLA1].
#
# Machine-readable companion to spec.md — see issue #248. The `# Constituent
# Modules` prose stays for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# Depth 1. The sensor cytosol is expanded because this Cell builds it.

module: atc-sensing-cell
title: SensorCell[aTc ⟶ PLA1]
refines:
  # Two incomparable parents: the chassis is the cell without
  # modules in it, and this is that chassis with a sensor module put into it.
  # Which chassis is read off the constituents, not the demo name.
  # FUNCTIONAL PARENT FIRST -- the meet renderer aligns on entry one.
  - sensing-cell
  - cell-base-cytosol-popc-chol
  - guv
  # GUV appended 2026-10-04: the class is determined by the process that
  # produces this page, and that is Encapsulation: Phase Transfer. It is LAST because
  # the first entry is the alignment parent and must be the FUNCTIONAL one;
  # size is form, not function.

inputs:
  base-cytosol:
    title: "Base Cytosol"
    page: ../base-cytosol/spec.md
  detector-tetr-atc:
    title: "Detector: tetR-aTc"
    page: ../detector-tetr-atc/spec.md
  effector-pla1-teto:
    title: "Gated lysis DNA: pT7-tetO-PLA1"
    page: null            # pT7-tetO-PLA1. The tetO operator stitched to the PLA1 coding sequence,
                          # so the gate and the payload are ONE molecule. ../detector-tetr-atc/
                          # names pT7-tetO-deGFP, the REPORTER variant, so this cascade names its
                          # own payload rather than inheriting one. Files:
                          # effectors/detector-tetr-atc/pT7-tetO-PLA1-linear.gb 1202 bp and
                          # pOpen-T7-tetO-PLA1.gb 3140 bp, in nucleus-eng/DNA at f06e12c.
  reporter-lacz-enzyme:
    title: "LacZ Enzyme"
    page: ../reporter-lacz-enzyme/spec.md
  membrane-chicago:
    title: "Membrane: POPC/Chol (9:1)"
    page: ../membrane-popc-chol-9-1/spec.md

process_steps:
  - id: assemble-cytosol
    process:
      title: "Assemble Cytosol"
      page: ../../processes/assemble-cytosol/assemble-cytosol-main.md
      abstract: assemble-solution
    operator: mixing
    operands: [base-cytosol, detector-tetr-atc, effector-pla1-teto, reporter-lacz-enzyme]
    produces:
      id: atc-sensor-cytosol
      title: "SensorCytosol[aTc ⟶ PLA1]"
      page: ../atc-sensor-cytosol/spec.md

  - id: encapsulate
    process:
      # A chain: two processes run as one step, with no Module between them.
      composed_of:
        - title: "Encapsulation: Phase Transfer"
          page: ../../processes/assemble-base-cell/main.md
        - title: "Degrade Exterior LacZ"
          page: ../../processes/degrade-exterior-lacz/main.md
          # No operator. It composes nothing — it removes something.
    requires:
      - id: enzyme-encapsulated-substrate-outside
        of: reporter-lacz-enzyme
        why: >
          Degrade Exterior LacZ is defined only where the enzyme is encapsulated and its
          substrate is outside. ../../processes/degrade-exterior-lacz/main.md: "Use it
          where LacZ is encapsulated and its substrate is outside", and "do not use it
          where LacZ sits in the outer solution or is dispersed through a gel on purpose",
          because Proteinase K does not distinguish one LacZ from another. So refining the
          reporter decides whether this cleanup step exists at all, which is the implies
          arrow stated from the step.
    impositions:
      - id: proteinase-k
        why: >
          The chained Degrade Exterior LacZ sub-process doses Proteinase K.
    operator: packing
    operands: [atc-sensor-cytosol, membrane-chicago]
    produces:
      id: atc-sensing-cell
      title: "SensorCell[aTc ⟶ PLA1]"
      page: ../atc-sensing-cell/spec.md
    notes: >
      Proteinase K digests LacZ that escaped the cells, which would otherwise
      meet CPRG with no lysis and add background. It is a process reagent, not
      an operand — nothing of it is in the result. The cytosol is composed
      before encapsulation, not added to a closed chassis.

# The analyte reaches the Cell from outside after encapsulation, so aTc is not
# part of this composition.
