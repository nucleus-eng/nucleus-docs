# VENDORED. Do not edit this file here. Edit it in nucleus-skills and copy it back,
# or this repo and the DevNote repo will drift apart on one rule and nothing will say so.
#
# Source  nucleus-eng/nucleus-skills, main, fb8c87a
#         plugins/nucleus/references/vale/nucleus/house-casing.yml
#
# SEVERITY IS NOT IN THIS FILE, on purpose. Each repo sets it in its own .vale.ini.
# That is what lets a specification corpus run this rule at error while a DevNote
# repo, where new vocabulary enters, runs the same rule at warning.
extends: substitution
message: "Use '%s' instead of '%s' (house casing)."
swap:
  RPM: rpm
  KAN: Kan
  kDA: kDa
  KDA: kDa
  KDa: kDa
  kda: kDa
  Kda: kDa
  '(\d+)X\b': '$1x'
