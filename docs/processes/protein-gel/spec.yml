# Process source for Protein Gel (SDS-PAGE).
#
# Signature read from the page, and from the steps that run it where any do.
#
# AN ASSAY, AND THAT IS A DIFFERENT SHAPE FROM EVERY OTHER PROCESS HERE. It is separation of a mixture roughly by molecular weight under an applied field.
# compositional-biology-theory `glossary.md#T09` makes an Assay "a Measurement
# considered as applied: the Process that realizes one", so it IS a process -- but its
# codomain is a reading rather than a thing in a tube.
#
# DESTRUCTIVE. The sample is denatured, loaded and driven through the gel, so what was
# read no longer exists as it was. The reading costs the material it came from, and the
# step is terminal for that aliquot.
#
# `produces: measurement` IS A TYPE NO MODULE PAGE CARRIES. It is written because the
# alternative is claiming the assay produces its own input, which is false: the sample
# is consumed and what comes out is a number. See the open item.

process: protein-gel
title: "Protein Gel (SDS-PAGE)"

conserves: false

signature:
  takes:
    - type: component
      note: >
        A sample of the mixture being separated.
  produces:
    type: measurement
    note: >
      A reading, not a Component. This corpus has no page for that type.

open:
  - id: an-assay-returns-a-reading
    question: >
      `scripts/process-yml-schema.yml` gives `produces` one type and assumes it names
      something a Module could be. An assay breaks that: it returns a number.
      PART OF THIS IS NOW ANSWERED. `conserves:` says whether the input survives, which
      is the half that made a conservative assay look like it returned two things. What
      is still open is what type a reading IS -- no module page carries `measurement`,
      and ../colorimetric-readout now returns an `observation`, which is the
      supertype: that page has a route scored by eye and this one does not.
