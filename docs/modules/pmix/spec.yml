process_steps:
  - id: make-protein-buffer
    process:
      title: "Prepare Protein Purification Buffers and Media"
      page: ../../processes/make-protein/prep-consumables/main.md
    operator: mixing
    operands:
      - hepes-koh
      - potassium-chloride
      - magnesium-chloride
      - tcep
      - glycerol
      - water
    produces:
      id: protein-buffer
      title: "Protein Buffer (30 % glycerol)"
      page: null
    finals:
      hepes-koh: {value: 50, unit: "mM"}
      potassium-chloride: {value: 100, unit: "mM"}
      magnesium-chloride: {value: 10, unit: "mM"}
      tcep: {value: 1, unit: "mM"}
      glycerol: {value: 300, unit: "mL/L"}
    balance: water
    notes: >
      The page makes Protein Buffer and Protein Buffer (60% glycerol) as two
      buffers that carry the same four salts at the same concentrations. A
      sample in Protein Buffer is mixed 1:1 with the 60% glycerol buffer, which
      leaves the salts as they are and halves the glycerol to 30 % v/v, so the
      buffer PMix is brought up in has the composition above.

  - id: make-pmix
    process:
      title: "Make Protein Mix"
      page: ../../processes/make-36pot/main.md
    operator: mixing
    operands:
      - alars
      - argrs
      - asnrs
      - asprs
      - cysrs
      - glnrs
      - glurs
      - glyrs
      - hisrs
      - ilers
      - leurs
      - lysrs
      - metrs
      - phers
      - prors
      - serrs
      - thrrs
      - trprs
      - tyrrs
      - valrs
      - if1
      - if2
      - if3
      - ef-g
      - ef-tu
      - ef-ts
      - rf1
      - rf2
      - rf3
      - rrf
      - mtf
      - ck
      - ak
      - ndk
      - ppiase
      - t7rnap
      - protein-buffer
    produces:
      id: pmix
      title: "Protein Mix (PMix)"
      page: ../pmix/spec.md
    concentration: {value: 15, unit: "µg/µL", note: "nominal total protein"}
    finals:
      alars: {value: 1086, unit: "ng/µL"}
      argrs: {value: 30, unit: "ng/µL"}
      asnrs: {value: 341, unit: "ng/µL"}
      asprs: {value: 125, unit: "ng/µL"}
      cysrs: {value: 18, unit: "ng/µL"}
      glnrs: {value: 59, unit: "ng/µL"}
      glurs: {value: 196, unit: "ng/µL"}
      glyrs: {value: 149, unit: "ng/µL"}
      hisrs: {value: 12, unit: "ng/µL"}
      ilers: {value: 622, unit: "ng/µL"}
      leurs: {value: 63, unit: "ng/µL"}
      lysrs: {value: 99, unit: "ng/µL"}
      metrs: {value: 36, unit: "ng/µL"}
      phers: {value: 264, unit: "ng/µL"}
      prors: {value: 155, unit: "ng/µL"}
      serrs: {value: 30, unit: "ng/µL"}
      thrrs: {value: 97, unit: "ng/µL"}
      trprs: {value: 97, unit: "ng/µL"}
      tyrrs: {value: 10, unit: "ng/µL"}
      valrs: {value: 28, unit: "ng/µL"}
      if1: {value: 155, unit: "ng/µL"}
      if2: {value: 622, unit: "ng/µL"}
      if3: {value: 155, unit: "ng/µL"}
      ef-g: {value: 777, unit: "ng/µL"}
      ef-tu: {value: 7764, unit: "ng/µL"}
      ef-ts: {value: 777, unit: "ng/µL"}
      rf1: {value: 155, unit: "ng/µL"}
      rf2: {value: 155, unit: "ng/µL"}
      rf3: {value: 155, unit: "ng/µL"}
      rrf: {value: 155, unit: "ng/µL"}
      mtf: {value: 311, unit: "ng/µL"}
      ck: {value: 63, unit: "ng/µL"}
      ak: {value: 46, unit: "ng/µL"}
      ndk: {value: 16, unit: "ng/µL"}
      ppiase: {value: 16, unit: "ng/µL"}
      t7rnap: {value: 155, unit: "ng/µL"}
    balance: protein-buffer
    notes: >
      Each protein is purified on its own and stored in Protein Buffer with
      glycerol. The proteins are mixed, washed in Protein Buffer, concentrated,
      and brought to a total of 15 ug/uL with Protein Buffer that carries
      glycerol at 300 mL/L (30 % v/v). Glycerol and the buffer salts enter the
      reaction only through PMix, so at 1.2 uL of PMix per 10 uL glycerol is
      36 mL/L and magnesium chloride is 1.2 mM there. The 36 finals
      above add up to 14 994 ng/uL against the 15 000 total that spec.md
      states, a difference the size of the rounding in the per-protein figures.
      Make OnePot Protein Mix (../../processes/make-1pot/main.md) co-expresses
      and co-purifies the 36 proteins instead of purifying each one.

open:
  - id: onepot-route
    kind: question
    question: >
      Whether Make OnePot Protein Mix makes this Module. Its page adds the
      product at 2.4 mg/mL in the reaction, against 1.8 mg/mL for this Module
      in Base Cytosol. It finishes the product in a different buffer, and it
      states no per-protein concentrations. If its product is a different
      composition, it is a variant with a directory of its own and not a second
      route to this one.
