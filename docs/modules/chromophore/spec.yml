# Composition source for Chromophore.
#
# A CHROMOPHORE CLASS IS GROUNDED, AND HAS MORE THAN ONE MEMBER.
#
# THE OBJECTION WAS THAT IT WOULD BE GROUNDED ON A SENSITIVITY, which is not one of the
# three grounds a class may rest on -- Function, Composition, Requirement. THAT IS NOT
# WHAT GROUNDS IT.
#
# Members do not share "bleaches under UV". They share a CONJUGATED SYSTEM, and the
# bleaching follows from it. So the earlier refusal was answering the wrong question: a
# class whose members share only a sensitivity would be a fourth ground, and this one
# shares the thing the sensitivity follows from.
#
# THE GROUND IS Function, NOT Composition, AND THAT IS A WORD PROBLEM RATHER THAN A
# CHEMISTRY ONE. This file first said Composition, on the parallel with
# ../protein/spec.yml. As a ground, `Composition` means "the profile that produces
# it" -- the type is the codomain of an attested operation profile, which is why
# Membrane and Vesicle sit there: `encapsulate` makes them. NOTHING IN THIS CORPUS PRODUCES A CHROMOPHORE, so there is no profile and that
# ground is unavailable.
#
# The ground is the operation `emit_color`. The conjugated system is why that operation
# is true of every member, which is real work and belongs in the page's prose rather
# than in the ground. The ground answers what a class page transcribes, and the answer
# is the operation.
#
# IT IS NOT `Color`, AND THAT OBJECTION DOES HOLD. `Color` refines `Signal`, which is
# "what an object emits that a reader can detect" -- the codomain of an emitting
# operation. A chromophore is the domain. Making one class of both is the
# ingredients-versus-product error `C19` names.
#
# IT CUTS ACROSS THE TREE. Members are also Substrates and Reporters, and `refines:`
# takes a list, so no member is moved to make room for this.
#
# THE THREE MEMBERS ARE NOT ALIKE AND THE PAGE SAYS SO. CPRG is yellow as supplied and
# its cleaved product is a SECOND chromophore. X-Gal is colorless as supplied and the
# indigo product is the chromophore. deGFP absorbs and re-emits. Nothing here claims
# they bleach alike.
#
# `Fluorophore` IS SPLIT OUT, as of 2026-10-07, and this file said it was not. The test
# it had to pass is the one written here: a refinement is real when it declares an
# operation its parent does not. The operation is re-emission. A chromophore absorbs
# and a reader measures what did not come back; a fluorophore absorbs and then emits at
# a longer wavelength, and a reader measures light the molecule produced. Two
# wavelengths rather than one.
#
# WHAT CHANGED IS THE CORPUS AND NOT THE TEST. When this was written the only candidate
# was deGFP, and a one-member class is a rule nobody has tested. ../fluorophore has
# five: two reporters, two membrane labels and one lumen dye.
#
# THE BLEACHING STAYS HERE, where the conjugated system is. Re-emission is not why a
# member bleaches, so the sensitivity belongs to this class and reaches ../fluorophore
# through `refines:` like any other member.

module: chromophore
title: "Chromophore"

inputs: {}
process_steps: []

sensitivities:
  - id: uv-exposure
    to: uv-exposure
    basis: rule
    why: >
      A conjugated system is what absorbs visible light and it is what ultraviolet light
      destroys. The mechanism that makes a member usable as a readout is the mechanism
      that bleaches it, so the sensitivity holds for the kind rather than for the
      members that happen to have been tested.
    page: spec.md
  - id: illumination
    to: illumination
    basis: rule
    severity: moderate
    why: >
      The light a reader shines on a member in order to read it is absorbed by the same
      conjugated system that makes the member readable, and some of what is absorbed
      destroys it. So the act of reading costs signal, and the mechanism is the one the
      class is grounded on.
      MODERATE RATHER THAN BLOCKING. One read costs a little and the reading still
      works; a kinetic run repeats the exposure and the cost accumulates. Nobody here
      has measured the per-read cost, so there is no bound to write and the severity is
      what carries the difference.
      A SEPARATE ID FROM `uv-exposure`, which is the crosslinking dose
      ../../processes/embed-photodevelopment applies. Borrowing that one would make two
      different things one, which is the mistake
      ../../processes/microscopy-readout/spec.yml warned about while it had no
      sensitivity to meet.
