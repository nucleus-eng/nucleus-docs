name: Build Protocols

on:
  pull_request:
    branches: [main]

# Build-only gate: render every lab-ready protocol/BOM PDF so a content edit
# that breaks rendering is caught before merge (and before it could break the
# deploy). Does not publish or commit — uploads the PDFs as an artifact for
# reviewers. See issue #10. Also gates on `myst build --html --strict` so a
# broken link, missing image, or malformed directive fails CI instead of
# only surfacing on a local build. See issue #176.
jobs:
  check-bom-labels:
    # Fast static check (no toolchain): bom-<slug> labels match their directory
    # and BOM download buttons have a backing table. See scripts/check-bom-labels.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check BOM label conventions
        run: python3 scripts/check-bom-labels.py

  bom-tests:
    # Unit tests over scripts/bom_common.py — the shared parse/normalize/index
    # module every BOM consumer imports. These invariants (round-trip stability,
    # inline-vs-CSV agreement, placeholder unification, self-exclusion) are
    # execution-dependent and not caught by read-through review. See issue #114.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pytest
        run: pip install pytest
      - name: Run bom_common test suite
        run: python3 -m pytest scripts/tests/ -q

  build-protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install MyST
        run: npm install -g mystmd@1.9.1
      - name: Install typst
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - name: Build lab-ready protocols
        run: python3 scripts/build-protocols.py
      - name: Generate distribution-wide materials reference
        # guides/materials-reference.md `{include}`s a gitignored generated
        # partial — without this the strict build below reports it as a real
        # missing-file error.
        run: python3 scripts/build-materials-reference.py
      - name: Check for myst build errors
        # Wraps `myst build --html --strict`, failing only on unfiltered ⛔️
        # errors (⚠️ warnings are non-blocking). Must run after both
        # generators above so the generated PDFs/CSVs the download buttons
        # and includes point at actually exist. See issue #176 and
        # scripts/check-myst-build.py.
        run: python3 scripts/check-myst-build.py
      - name: Upload generated PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-ready-protocols
          path: docs/processes/**/generated/*.pdf
          if-no-files-found: warn
