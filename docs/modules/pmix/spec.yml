# Composition source for Protein Mix (PMix).
#
# Machine-readable companion to spec.md. ../base-cytosol/spec.yml names this
# Module as its `pmix` input, so a cascade rendered at `--depth 2` or deeper
# can expand Base Cytosol down to each protein.
#
# One input per protein. `molar_mass` is the mass of the assembled complex:
# the monomer mass times the oligomeric state given in the spec.md table, and
# for GlyRS and PheRS the combined alpha2-beta2 mass the table already gives.
# A molar concentration computed from it is the concentration of the complex,
# which is what the table's Molarity column reports.

module: pmix
title: "Protein Mix (PMix)"
type: Solution

