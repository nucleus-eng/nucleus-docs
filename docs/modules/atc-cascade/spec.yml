# Composition source for the aTc Cascade.
#
# Machine-readable companion to spec.md — see issue #248. The `# Constituent
# Modules` prose stays for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# Depth 1. This is the aTc integration path, entire. A module that bonded it to
# the pH path was retired 2026-10-03, because nobody is building that device.

module: atc-cascade
title: aTc Cascade

inputs:
  base-cytosol:
    title: "Base Cytosol"
    page: ../base-cytosol/spec.md
  detector-tetr-atc:
    title: "Detector: tetR-aTc"
    page: ../detector-tetr-atc/spec.md
  effector-pla1:
    title: "Lysis: PLA1"
    page: ../effector-pla1/spec.md
  reporter-lacz-enzyme:
    title: "LacZ Enzyme"
    page: ../reporter-lacz-enzyme/spec.md
  membrane-chicago:
    title: "Membrane: POPC/Chol (9:1)"
    page: ../membrane-popc-chol-9-1/spec.md
  substrate-cprg:
    title: "Substrate: CPRG"
    page: ../substrate-cprg/spec.md
  mineral-oil:
    title: "Mineral oil"
    page: null            # the lipid-in-oil phase of the transfer. No module page
  analyte-atc:
    title: "Analyte: aTc"
    page: ../analyte-atc/spec.md
  glucose:
    title: "Glucose"
    page: null
  hepes-koh:
    title: "HEPES-KOH buffer"
    page: null            # 0.5 M Tris base, 1.7 M HEPES, pH 7.4
  energy-solution:
    title: "Energy solution"
    page: null            # @Editor(chicago): contents not recorded
  peg-norbornene-monomer:
    title: "4-arm PEG-norbornene"
    page: ../gel-peg-norbornene/spec.md
  peg4sh:
    title: "PEG4SH crosslinker"
    page: null
  lap:
    title: "LAP photoinitiator"
    page: null

process_steps:
  - id: assemble-outer-solution
    process:
      title: "Assemble Outer Solution"
      page: ../../processes/assemble-outer-solution/main.md
      abstract: assemble-solution
    operator: mixing
    operands: [glucose, hepes-koh]
    produces:
      id: outer-solution-glucose-hepes
      title: "Outer Solution: Glucose-HEPES"
      page: ../outer-solution-glucose-hepes/spec.md
    parameters:
      osmolarity: "~1180 mOsm"    # measured or calculated is not recorded in any source

  - id: assemble-cytosol
    process:
      title: "Assemble Cytosol"
      page: ../../processes/assemble-cytosol/assemble-cytosol-main.md
      abstract: assemble-solution
    operator: mixing
    operands: [base-cytosol, detector-tetr-atc, effector-pla1, reporter-lacz-enzyme]
    produces:
      id: atc-sensor-cytosol
      title: "SensorCytosol[aTc ⟶ PLA1]"
      page: ../atc-sensor-cytosol/spec.md
    parameters:
      # MOVED HERE 2026-10-03 from ../reporter-lacz-enzyme/spec.md's range table,
      # which keyed its rows by cascade. The enzyme's own page states the range;
      # this is the dose this path used, encapsulated in a GUV in PEG-norbornene.
      lacz_enzyme: "2.5 U/mL final; 0.5 uL of a 125 U/mL stock into a 25 uL reaction"

  - id: encapsulate
    process:
      composed_of:
        - title: "Encapsulation: Phase Transfer"
          page: ../../processes/assemble-base-cell/main.md
        - title: "Degrade Exterior LacZ"
          page: ../../processes/degrade-exterior-lacz/main.md
    requires:
      - id: enzyme-encapsulated-substrate-outside
        of: reporter-lacz-enzyme
        why: >
          Degrade Exterior LacZ is defined only where the enzyme is encapsulated and its
          substrate is outside. ../../processes/degrade-exterior-lacz/main.md: "Use it
          where LacZ is encapsulated and its substrate is outside", and "do not use it
          where LacZ sits in the outer solution or is dispersed through a gel on purpose",
          because Proteinase K does not distinguish one LacZ from another. So refining the
          reporter decides whether this cleanup step exists at all, which is Jon's implies
          arrow of 2026-09-21 stated from the step.
    impositions:
      - id: proteinase-k
        why: >
          The chained Degrade Exterior LacZ sub-process doses Proteinase K.
    operator: packing
    operands: [atc-sensor-cytosol, membrane-chicago, mineral-oil]
    produces:
      id: atc-sensing-cell
      title: "SensorCell[aTc ⟶ PLA1]"
      page: ../atc-sensing-cell/spec.md

  - id: embed-photodevelopment
    process:
      title: "Embedding: Photodevelopment"
      page: ../../processes/embed-photodevelopment/main.md
      abstract: embed-photodevelopment
    impositions:
      - id: uv-exposure
        why: >
          The gel is crosslinked by UV with the cell already in the precursor.
    operator: packing
    operator_pairs:
      # THE STEP DOES TWO THINGS AND ONE LABEL CANNOT SAY BOTH. It forms a gel phase
      # AND holds membrane-bounded cells in it. `packing` is right for every pair
      # involving atc-sensing-cell, which keeps its own compartment, and wrong for the
      # two below: a polymer and the outer solution share one phase with no boundary
      # between them, which is what codimension-is-a-coordinate.md:32 states as
      # "Gel = OuterSolution (+) polymer, same compartment, no membrane between them".
      #
      # SAME SHAPE AS embed-agarose AND embed-ulga, which have carried these exceptions
      # since they were written. These two steps were the ones that never got them, and
      # they are the four violations check-operator-pairs.py has been reporting.
      #
      # lap is NOT here. It is a photoinitiator, the checker gives it its own sort on
      # purpose, and stretching `polymer` to cover a small-molecule initiator would
      # extend the seed by a sort assignment. Its pairs report unknown and should.
      - operands: [peg-norbornene-monomer, outer-solution-glucose-hepes]
        operator: mixing
      - operands: [peg4sh, outer-solution-glucose-hepes]
        operator: mixing
    operands:
      - peg-norbornene-monomer
      - peg4sh
      - lap
      - outer-solution-glucose-hepes
      - atc-sensing-cell
    produces:
      id: atc-gel
      title: "aTc gel piece"
      page: null
    notes: >
      No concentration is established for the monomer, the crosslinker or the
      photoinitiator, and exposure time depends on all three. The PEGDA route
      was cut by the Chicago Node on 2026-09-11, because PEGDA destroys the
      liposomes; ../gel-pegda/spec.md carries the reason.

  - id: assemble-trigger-solution
    process:
      title: "Trigger Solution"
      page: null
      abstract: assemble-solution
    operator: mixing
    operands: [substrate-cprg, analyte-atc]
    produces:
      id: atc-trigger-solution
      title: "Trigger Solution"
      page: null
    notes: >
      THE BOARD MAKES THE SOLUTION BEFORE IT ADDS IT, and the two were one step here
      until 2026-10-03. Splitting them is what lets the analyte into this source at all:
      the single step took the gel and the substrate and never named what triggers it.
      ../../processes/ has no page for mixing the two, so the process is `page: null`.

  - id: dose-trigger-solution
    process:
      title: "Addition of Solution to gel"
      page: null
    operator: packing
    operands: [atc-gel, atc-trigger-solution]
    produces:
      id: atc-cascade
      title: "aTc Cascade"
      page: ../atc-cascade/spec.md
    notes: >
      After crosslinking, not before. UV bleaches CPRG, so this path cannot
      carry the substrate through photodevelopment and cannot use a substrate
      liposome. That is why it differs from the pH path in where CPRG lives.

measured_by:
  - process:
      title: "Colorimetric Readout"
      page: ../../processes/colorimetric-readout/main.md

open:
  - id: peg-norbornene-precursor-solvent
    question: >
      No page states what the PEG-Norbornene precursor dissolves in. This file
      dissolves it in the Outer Solution; anything less would put a large
      osmotic gradient across the membrane at the moment of embedding — the
      cells sit at about 1180 mOsm. ../ph-cascade/spec.yml carries the same
      item for its own path. @Editor(chicago).
