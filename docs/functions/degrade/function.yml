# What the Degrade page says, as data. See ../transcribe/function.yml for the field marks.
# A route with no `species:` has no declared change: a reader treats that as unknown, never zero.
signature_pin: a7c7a7a
operations:
  - operation: degrade               # checked
    refines: []                      # checked
    type: >                          # docs
      Takes the degrader and what it acts on, and returns the degrader unchanged, with the target broken down.
    routes:
      - id: protein-tag
        key: "degrade[ssrA]"         # checked: a declared operation
        refines: degrade             # checked: stated, or implied by the stem
        docs_group: protein          # docs only: a grouping the signature does not state
        realized_by: [control-clpxp]
      - id: protein-any
        key: "degrade[Protein]"
        refines: degrade
        docs_group: protein
        realized_by: [s30-lysate]
      - id: rna
        key: "degrade[RNA]"
        refines: "degrade[NucleicAcid]"
        docs_group: rna
        realized_by: [s30-lysate]
      - id: dna-linear
        key: "degrade[linearDNA]"
        refines: "degrade[NucleicAcid]"
        docs_group: dna
        realized_by: [s30-lysate]
      - id: pyrophosphate
        key: "degrade[PPi]"
        refines: degrade
        docs_group: pyrophosphate
        species:                     # docs, checked
          per_event: {PPi: -1, Pi: 2}
        realized_by: [base-cytosol, atc-sensor-cytosol, ph-sensor-cytosol, theophylline-sensor-cytosol]
      - id: atp
        key: "degrade[ATP]"
        refines: degrade
        docs_group: nucleotide
        species:                     # docs, checked
          per_event: {ATP: -1, ADP: 1, Pi: 1}
        realized_by: []              # no attested member: Base Cytosol is only inferred to do it
