module: analyte-3oc6-hsl
title: "Analyte: 3OC6-HSL"

inputs:
  3oc6-hsl:
    title: "N-3-oxohexanoyl-L-homoserine lactone"
    page: null

process_steps: []

open:
  - id: no-dose-figures-anywhere
    question: >
      Both bands read "not documented" and the page carries an open @Editor(london)
      tag saying so. Neither ../detector-3oc6-hsl/spec.md nor ../ahsl-sensing-cell/spec.md
      states an induction concentration or a working range. The tag also asks whether
      the cascade and the sensing cell use the same one, which is a second question
      the corpus cannot answer today.
  - id: the-solubility-flag-bears-on-this-page
    question: >
      An urgent flag raised 2026-09-17 says AHSL stock made in water at 2 mM may be a
      suspension rather than a solution, because aqueous AHSL may not exceed about
      20 uM. If that holds, every dose from that stock delivered an unknown
      concentration. It is being announced at the studio and is already with the
      b.next team. This file records no dose, so nothing here is wrong either way —
      but any figure that arrives must be read against that flag before it is entered.
  - id: an-atom-is-its-own-input
    question: >
      `inputs` still carries `minProperties: 1`, so this Module lists itself. Same
      constraint `minItems` was, one field over. See ../analyte-iptg/spec.yml.
