# Process source for Encapsulate.
#
# Signature read from the steps that run it, not from the page's prose.
#
# `operator: packing` NOW THAT THE SPLIT IS RESOLVED, AND IT RESOLVED THE WAY THE
# DEFINITION SAID IT WOULD. The inventory found 6 `packing` steps and 1 `mixing` step
# under this process, and this file first declared no operator on the schema's rule that
# a process whose instances disagree declares none.
#
# The odd step was ../../modules/membrane/spec.yml's `close-the-bilayer`, which takes a
# lipid and a label and produces a bilayer -- no payload, no compartment. It is
# ../prep-lipids and is repointed there. Encapsulation makes a compartment, which is
# `packing` by definition, and all 6 remaining instances agree.
#
# THE THIRD ARGUMENT IS THE ONE NOBODY WRITES. The steps supply a membrane and a payload
# and leave the outer solution implicit, but the ruled signature has three positions and
# the product's type names the third. It is declared here because the signature is what
# a process source is for.
#
process: encapsulate
title: "Encapsulate"

signature:
  takes:
    - type: membrane
      note: >
        The bilayer that becomes the boundary.
    - type: solution
      note: >
        The inner solution. What ends up inside.
    - type: outer-solution
      note: >
        What the product is suspended in. Ruled in `the-composition-model` C1 as the third argument.
  produces:
    type: container
    note: >
      `outer_solution{Membrane[membrane_components]{inner_solution}}`. THE NESTING IS IN THE RETURN TYPE AND NOT IN THE APPLICATION: one step, three inputs.

operator: packing
