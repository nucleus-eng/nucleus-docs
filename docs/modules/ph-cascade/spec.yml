# Composition source for the pH Cascade.
#
# Machine-readable companion to spec.md — see issue #248. The `# Constituent
# Modules` prose stays for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# Depth 1. This is the pH integration path of the Chicago Cascade, entire.
# chicago-cascade/spec.yml builds the same path and bonds the result to
# the aTc one.

module: ph-cascade
title: pH Cascade

inputs:
  base-cytosol:
    title: "Base Cytosol"
    page: ../base-cytosol/spec.md
  ph-responsive-ssdna:
    title: "pH-responsive ssDNA"
    page: null
  trigger-ssdna:
    title: "Trigger ssDNA"
    page: null
  effector-pla1:
    title: "Lysis: PLA1"
    page: ../effector-pla1/spec.md
  membrane-chicago:
    title: "Membrane: POPC/Chol (9:1)"
    page: ../membrane-popc-chol-chicago/spec.md
  substrate-cprg:
    title: "Substrate: CPRG"
    page: ../substrate-cprg/spec.md
  reporter-lacz-enzyme:
    title: "LacZ Enzyme"
    page: ../reporter-lacz-enzyme/spec.md
  lga-powder:
    title: "LGA powder, 0.7%"
    # REPOINTED 2026-09-24 on Jon's instruction, "update ph-cascade spec to point to
    # the correct gel", to ../gel-lga/spec.md.
    #
    # THIS REVERSES A RULING OF JON'S OWN, THREE DAYS OLD, AND THE OLD ONE IS KEPT
    # HERE RATHER THAN DELETED. 2026-09-21: "agarose is ULGA, confirmed. i know we
    # were claiming they might not be, but I've confirmed with devs." That is a
    # stronger kind of evidence than what reverses it.
    #
    # WHAT REVERSES IT. ../ph-sensing-cell/spec.md:147 says "0.7% low-gelling
    # agarose", and the DevStudio board of 2026-09-23 has the pH presenter saying
    # "I used the low gelling" with ultra-low raised separately as a possible
    # substitution. THE TWO ARE DIFFERENT PRODUCTS AND NOT TWO WORDS FOR ONE:
    # ../gel-lga/spec.yml gives LGA a gel point of 30 °C and ../gel-ulga/spec.yml
    # gives ULGA 8-17 °C, both from vendor datasheets Jon supplied 2026-09-24.
    # THE SESSION'S OWN FIGURE FOR THE ULTRA-LOW GRADE WAS 14 °C AND IT IS
    # SUPERSEDED, not contradicted: 14 falls inside the datasheet's 8-17 range,
    # and 17 is the end an embedding step needs because it bounds "still liquid".
    # The distinction this comment draws holds under either figure.
    #
    # THE KEY IS RENAMED AND THAT IS NEW. The old comment declined to rename it on
    # the grounds that ULGA is a grade of agarose rather than another material, so
    # `lga-powder` was under-specified rather than wrong. Under this ruling it is
    # wrong, and a key naming the other polymer is worse than a third name for one.
    page: ../gel-lga/spec.md
  tris-hepes-stock:
    title: "Tris-HEPES buffer stock"
    page: null            # 0.5 M Tris base, 1.7 M HEPES, pH 7.4
  energy-solution:
    title: "Energy solution"
    page: null            # @Editor(chicago): contents not recorded

process_steps:
  - id: assemble-outer-solution
    process:
      title: "Assemble Outer Solution"
      page: ../../processes/assemble-outer-solution/main.md
      abstract: assemble-solution
    operator: mixing
    operands: [tris-hepes-stock, energy-solution]
    produces:
      id: outer-solution-chicago
      title: "Chicago Outer Solution"
      page: ../outer-solution-chicago/spec.md
    parameters:
      tris-hepes: "42.5% (v/v) in water"
      osmolarity: "~1180 mOsm"    # measured or calculated is not recorded in any source
    notes: >
      The agarose dissolves into this and both populations sit in it.
      Osmolarity is additive; the polymer's own term is negligible at about
      0.7% (w/v), so this value sets the gel's.

  - id: anneal-trigger-duplex
    process:
      title: "Anneal pH-Responsive Trigger Duplex"
      page: ../../processes/anneal-ph-trigger-duplex/main.md
    operator: mixing
    operands: [ph-responsive-ssdna, trigger-ssdna]
    produces:
      id: ph-trigger-duplex
      title: "pH trigger duplex"
      page: ../detector-ph/spec.md

  - id: assemble-cytosol
    process:
      title: "Assemble Cytosol"
      page: ../../processes/assemble-cytosol/assemble-cytosol-main.md
      abstract: assemble-solution
    operator: mixing
    operands: [base-cytosol, ph-trigger-duplex, effector-pla1]
    produces:
      id: ph-sensor-cytosol
      title: "SensorCytosol[pH ⟶ PLA1]"
      page: ../ph-sensor-cytosol/spec.md

  - id: encapsulate
    process:
      title: "Encapsulation: Phase Transfer"
      page: ../../processes/assemble-base-cell/main.md
    operator: packing
    operands: [ph-sensor-cytosol, membrane-chicago]
    produces:
      id: ph-sensing-cell
      title: "SensorCell[pH ⟶ PLA1]"
      page: ../ph-sensing-cell/spec.md

  - id: encapsulate-substrate-suv
    process:
      title: "Encapsulation: Extrusion"
      page: ../../processes/encapsulate-suv/main.md
    operator: packing
    operands: [substrate-cprg, membrane-chicago]
    produces:
      id: substrate-cprg-suv
      title: "Substrate SUV: CPRG"
      page: ../substrate-cprg-suv/spec.md
    notes: >
      This path keeps the substrate liposome because agarose imposes no UV.
      Confirmed 2026-09-11: the Liu Lab runs the pH solution and still uses
      SUVs.

  - id: embed-agarose
    process:
      title: "Embedding: Thermal Setting"
      page: ../../processes/embed-thermal-setting/main.md
      abstract: embed-hydrogel
    impositions:
      - id: thermal-hold
        bound:
          quantity: temperature
          sense: at-least
          from: { operand: lga-powder, key: gel_point_max_c }
        why: >
          The polymer must be liquid when the cells go in, so this step holds them at
          or above its gelling point until the gel sets. THE BOUND IS READ OFF THE
          POLYMER RATHER THAN WRITTEN HERE, which is what lets one embedding process
          carry both agaroses: LGA holds at 30 °C and ULGA at 17 °C. A literal would need one
          step per polymer, and one step per polymer is two processes.
    operator: packing
    operator_pairs:
      - operands: [lga-powder, outer-solution-chicago]
        operator: mixing
      - operands: [lga-powder, reporter-lacz-enzyme]
        operator: mixing
      - operands: [outer-solution-chicago, reporter-lacz-enzyme]
        operator: mixing
        note: >
          Both share the outer phase and neither carries a boundary, so this
          pair mixes. The step's `packing` label is right for the seven pairs
          that involve a membrane-bounded operand and wrong for these three.
    operands:
      - lga-powder
      - outer-solution-chicago
      - ph-sensing-cell
      - substrate-cprg-suv
      - reporter-lacz-enzyme
    produces:
      id: ph-cascade
      title: "pH Cascade"
      page: ../ph-cascade/spec.md
    parameters:
      lga-powder: "0.7% (w/v)"   # sets thermally; no crosslinker
      # MOVED HERE 2026-10-03 from ../reporter-lacz-enzyme/spec.md's range table,
      # which keyed its rows by cascade. The enzyme's own page states the range;
      # this is the dose this path used, encapsulated in a GUV in 0.7% agarose.
      lacz_enzyme: "156 U/mL"
    notes: >
      The mixing ratio of sensing cells to SUVs to LacZ is not established —
      the same gap London closed on 2026-09-09 and this path still has.

measured_by:
  - process:
      title: "Colorimetric Readout"
      page: ../../processes/colorimetric-readout/main.md
