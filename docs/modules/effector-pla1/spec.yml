# Composition source for Effector: PLA1.
#
# Machine-readable companion to spec.md — see issue #248. The `# Reference
# Composition` tabs stay for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# THIS FILE WRITES THE UNGATED CONFIGURATION AND ONLY THAT ONE. Jon's ruling,
# 2026-09-21. The page's Cytosol tab carries five configurations, and this file
# is the first of them: constitutive expression with no sensing circuit. The page
# itself says why that is the defensible reference rather than an arbitrary pick —
# "the first is the only one with no upstream gate, so it is the only one that
# reports on PLA1 rather than on a cascade."
#
# THE OTHER FOUR ARE NOT CONFIGURATIONS OF THIS MODULE. Jon, 2026-09-21: "those
# other DNA variants are just the PLA1 module stitched with detector DNA." Under
# glossary.md#T37 in compositional-biology-theory, stitching `⌢` joins operands in
# order into one polymer, it is associative and not commutative (rulings.md#D35),
# and it is homogeneous — DNA stitched to DNA is DNA (signature.md:286). So
# `LuxR-PLA1` is `luxR-cassette ⌢ pla1-cds`, a DIFFERENT DNA Module that contains
# PLA1, not this Module in a different setting. See the open entry below.
#
# The step is `mixing`: two additions into Base Cytosol, sharing its resources.
# No `packing` step appears here — encapsulation is a step on ../base-cell/spec.yml —
# so nothing in this file depends on open question O8 in
# compositional-biology-theory, "are formation and `hold` one operation?".

module: effector-pla1
title: "Effector: PLA1"

inputs:
  base-cytosol:
    title: "Base Cytosol"
    page: ../base-cytosol/spec.md
  pla1-dna:
    title: "T7pro-PLA1-T7term"
    page: null            # no confirmed sequence file in nucleus-eng/DNA; see below
  optiprep:
    title: "Optiprep"
    page: null
    optional: true        # encapsulation aid, not lysis chemistry — same judgement
                          # as ../reporter-degfp/spec.yml, and the same open item

process_steps:
  - id: assemble-pla1-inner-solution
    process:
      title: "Assemble the ungated PLA1 inner solution"
      page: null
    operator: mixing
    operands: [base-cytosol, pla1-dna, optiprep]
    produces:
      id: effector-pla1
      title: "Effector: PLA1"
      page: ../effector-pla1/spec.md
    parameters:
      pla1_dna: "14 ng/uL"
      optiprep: "5% of the reaction"
      reaction_volume: "20 uL"
    notes: >
      Base Cytosol carries no parameter entry here: it has a page of its own and
      that page states its composition, which is the rule an audit of thirteen
      parameter entries settled on 2026-09-19. The three figures kept are the ones
      no constituent page can state, because they are this assembly's own.
      PLA1 is expressed from the construct rather than added as a reagent, so this
      Module has no working concentration of the protein and the DNA dose is the
      only dose there is.

measured_by:
  - process:
      title: "Colorimetric Readout"
      page: ../../processes/colorimetric-readout/main.md

open:
  - id: the-four-gated-variants-are-stitched-dna-modules
    question: >
      The page lists five configurations and this file writes one. The other four are
      London AHL (`LuxR-PLA1`, 15 ng/uL, in S30 Lysate), Chicago aTc (`TetO-PLA1`,
      1 nM, also tested at 0.5 nM), Chicago pH (a toehold-switch-gated PLA1 template,
      2 nM) and Chicago theophylline (`T7pro-PLA1-T7term`, dose not documented).
      They are recorded here so the omission is a claim rather than a gap.
      Jon's reading, 2026-09-21, is that they are not configurations of this Module at
      all: each gated construct is this Module's coding sequence STITCHED to a
      detector's DNA, so the product is a different DNA Module that contains PLA1.
      If that is right, each of the four belongs on the detector or cascade page that
      owns the stitched construct, and this file is complete rather than partial.
      What is not settled is where the stitched Modules get their pages. No page in
      this corpus is currently the owner of `LuxR-PLA1` or `TetO-PLA1` as objects in
      their own right; both are listed as constructs on pages about something else.
  - id: no-result-isolates-this-module
    question: >
      Lysis is always scored by the color it releases, never by a direct measure of
      membrane rupture or of enzyme activity. So `measured_by` names the colorimetric
      readout because that is the only measurement there is, and it measures the
      Module together with the CPRG/LacZ chain it drives. No efficiency figure exists
      for PLA1 in any of the five configurations, and the ungated run is unisolated in
      this second sense even though it is ungated in the first.
  - id: the-construct-has-no-sequence-file
    question: >
      `T7pro-PLA1-T7term` has no confirmed file in nucleus-eng/DNA and no recorded
      length, so `page: null` above is the strongest claim available. The page says
      not to add a length or file entry until one lands there and its identity is
      confirmed against the construct name. Two coding sequences exist for this enzyme:
      Chicago's gated constructs agree with each other across the whole CDS, and
      London's `LuxR-PLA1` agrees with them at 77.6% of nucleotides and 100% of
      residues. Which of the two this construct carries is not stated.
  - id: an-encapsulation-aid-marked-optional
    question: >
      Optiprep is a density-gradient medium for phase transfer, not part of the lysis
      chemistry, and it is marked optional on that reading. The page lists it in the
      reaction without saying it is separable, so the mark is this file's judgement
      rather than the page's claim. ../reporter-degfp/spec.yml carries the identical
      judgement and the identical caveat, which makes this the second instance rather
      than a one-off, and an argument for settling it once.
