# Composition source for Gel: PEGDA.
#
# Machine-readable companion to spec.md — see issue #248. The `# Constituent
# Modules` prose stays for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# Every step here is `mixing`, and that is a claim rather than a default. A gel's own
# composition is polymer plus solvent ending in one phase. `packing` arises when a
# compartment is put INTO a gel, which is a step on the cascade pages, not here — so
# nothing in this file depends on whether forming a boundary and holding something in it
# are one operation, which is unsettled.

module: gel-pegda
title: "Gel: PEGDA"
refines: photopatterned-gel

inputs:
  pegda575:
    title: "PEGDA monomer, PEGDA575"
    page: null
  peg4sh:
    title: "PEG4SH crosslinker"
    page: null            # chain-transfer agent in this route, not the crosslinker
  lap:
    title: "LAP photoinitiator"
    page: null            # lithium phenyl-2,4,6-trimethylbenzoylphosphinate
  pbs:
    title: "PBS"
    page: null

process_steps:
  - id: assemble-precursor
    process:
      title: "Embedding: Photodevelopment"
      page: ../../processes/embed-photodevelopment/main.md
      abstract: embed-gel
    operator: mixing
    operands: [pegda575, peg4sh, lap, pbs]
    produces:
      id: pegda-precursor
      title: "PEGDA precursor solution"
      page: null
    # SCALE-FREE, 2026-10-05, under R36/R37/R38.
    finals:
      pegda575: {value: 200, unit: "mg/mL"}
      peg4sh: {value: 3, unit: "mg/mL"}
      lap: {value: 0.3, unit: "mg/mL"}
    notes: >
      PEG4SH is the same reagent as in the PEG-norbornene route and does a
      different job. There it is the crosslinker at roughly 40 mg/mL; here it is
      3 mg/mL, thirteen-fold lower, in a system where the acrylate self-polymerizes
      and needs no thiol partner. At this loading it is a chain-transfer agent.

  - id: photopattern
    process:
      title: "Embedding: Photodevelopment"
      page: ../../processes/embed-photodevelopment/main.md
      abstract: embed-gel
    impositions:
      # NOT MOVED TO ../../processes/embed-photodevelopment, and it was moved there and
      # straight back on 2026-10-05. That process has TWO CHEMISTRIES and only this one
      # proceeds through acrylate radicals. Hoisting it made check-conflicts.py report
      # ../atc-cascade imposing acrylate radicals on its own membranes -- and that
      # cascade runs the thiol-ene route, operands `peg-norbornene-monomer` and `peg4sh`,
      # which never sees an acrylate.
      #
      # AN IMPOSITION BELONGS TO A PROCESS WHEN EVERY INSTANCE INFLICTS IT, not when
      # every declaration of it names that process. `uv-exposure` passes that test and
      # moved; this one fails it and stays here, on the only instance that runs it.
      - id: radical-acrylate-polymerization
        why: >
          Acrylate crosslinking proceeds through free radicals, which attack what they
          reach.
    operator: mixing
    operands: [pegda-precursor]
    produces:
      id: gel-pegda
      title: "Gel: PEGDA"
      page: ../gel-pegda/spec.md
    parameters:
      # SPLIT 2026-10-05, same reason as gel_temperature_window_c on ../gel-ulga: one
      # string held two different quantities and a checker could read neither. The time
      # stays a free choice because ../gel-pegda/spec.md:101 says so in its own words,
      # "no single exposure time covers every condition". The wavelength is not a choice.
      exposure_s: "15 to 30, adjusted for monomer concentration, layer thickness and feature size"
      wavelength_nm: 405
    notes: >
      Canceled as a cell-carrying gel — radical acrylate polymerization destroys
      the lipid membranes. It stays live as a structural frame, where the cells go
      into a PEG4Nb inset and never enter the PEGDA.

open:
  - id: precursor-concentration-conflict
    question: >
      Protocol 2 makes a 200 mg/mL PEGDA575 precursor and protocol 3 calls for 150 mg/mL
      for the alginate-composite frame, in one document. 200 mg/mL is what this file
      and the page carry. Ojaswita Pant owns the answer.
  - id: patterning-setup
    question: >
      The mold or patterning-chamber setup is not established. Exposure time
      depends on it, so the (15-30) s window is reproducible only for whoever
      already has the rig.
