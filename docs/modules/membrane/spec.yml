# Composition source for Membrane.
#
# ONE CONSTITUENT, AND IT IS THE ONLY ONE THE CLASS NEEDS. A bilayer is lipid in a
# bilayer arrangement. Every difference between the three members is which lipids, so
# `lipid` is the constituent and the arrangement is the invariant rather than a part.
#
# A PORE IS NOT A MEMBER OF THIS CLASS. A Pore does not refine Membrane; it is a
# component that can be composed with one. It is written as
# `passive_transport : Pore ⊗ Membrane ⊗ Cargo[φₚ] ⟶ Membrane[permeable]; passes down
# ∇`, signature.md:203 at main `e40f3de`, so a pore and a membrane are two of three
# operands of one operation. See ../pore/spec.yml.
#
# The process is `page: null`: an abstract bilayer-forming process does not exist here.

module: membrane
title: "Membrane"
refines: container

inputs:
  lipid:
    title: "Membrane Components"
    page: ../membrane-components/spec.md
  fluorescent-label:
    title: "Fluorescent label"
    page: ../membrane-components/spec.md
    optional: true

process_steps:
  - id: close-the-bilayer
    process:
      # REPOINTED 2026-10-05 from ../../processes/encapsulate/main.md, which it was
      # never running: this step has no payload, no inner solution and no compartment.
      # It was the one `mixing` step among seven under Encapsulation, and Jon: "nothing
      # should be mixed by that point, all the mixing steps ... have already happened".
      #
      # ../../processes/prep-lipids IS ONLY HALF OF WHAT THIS STEP CLAIMS, and the
      # mismatch is in the step's own name. See the `open` item below.
      title: "Prepare Lipids"
      page: ../../processes/prep-lipids/main.md
      abstract: prep-lipids
    operator: mixing
    operands: [lipid, fluorescent-label]
    produces:
      id: membrane
      title: "Membrane"
      page: ../membrane/spec.md
    notes: >
      One required constituent and one optional label, which is the honest shape: the
      class has one part and the closure is the operation rather than a second part.
      `mixing` because the lipids end in one phase, the bilayer itself.

      THE LABEL BELONGS TO THE CLASS, NOT TO A MEMBER OR A ROUTE. A fluorescent lipid
      at about 0.1 mol% is an instrument for seeing the bilayer, not a thing the
      bilayer does, and any lipid membrane may carry one. Declaring it here is what
      lets a member stop claiming the dye distinguishes it: it is optional on all of
      them, so its presence on one preparation and absence from another is not a
      difference in identity.

open:
  - id: a-one-operand-step-asserts-nothing-about-pairs
    question: >
      `operator` on a step with one operand makes no pairwise claim, so `mixing` here
      is a label with nothing to falsify. scripts/check-operator-pairs.py will count
      it as `unknown` rather than as agreement, which is correct and worth knowing:
      this step is not evidence for the operator vocabulary either way.
  - id: the-closure-is-the-invariant-and-no-key-holds-it
    question: >
      What makes this a Membrane rather than a pile of lipid is that the bilayer is
      closed, so the inside is a volume. That is the class invariant and nothing in
      the schema records it. The composition above is true and does not say the one
      thing the class is for. Same shape as ../photopatterned-gel/spec.yml's
      geometry item.

  - id: nothing-closes-a-bilayer-on-its-own
    kind: choice
    question: >
      THE STEP IS NAMED FOR TWO ACTS AND ITS PROCESS COVERS ONE. `close-the-bilayer`
      mixes a lipid and an optional label, which is prep-lipids, and then claims the
      lipids "end in one phase, the bilayer itself" -- its own note says "the closure is
      the operation rather than a second part". Closure is a different act from mixing.

      AND NOTHING IN THIS CORPUS PERFORMS IT SEPARATELY. All three encapsulation routes
      form the bilayer themselves, around the payload:
      ../../processes/assemble-base-cell says "prepare your lipid mixture, form a
      water-in-oil emulsion from your inner solution and lipid mixture";
      ../../processes/encapsulate-luv hydrates a dried lipid film;
      ../../processes/encapsulate-suv starts from one. There is no bench step where a
      bilayer is closed with nothing inside it.

      SO A MEMBRANE WITH NO PAYLOAD MAY NOT BE A THING ANYBODY MAKES. 28 steps take a
      membrane as an operand, so the class earns its page as an argument position. What
      is doubtful is the producing step: it may be a modelling convenience standing in
      for an act that only ever happens inside encapsulation.

      Three readings, and this is Jon's to pick. Either the step is prep-lipids and
      should say so in its id and its product type; or it is prep-lipids followed by a
      closing operation nothing documents, and that operation needs a page; or the class
      should carry no producing step at all, which is what ../protein/spec.yml and
      ../dna/spec.yml already do with `process_steps: []`.

# WHAT THIS MODULE IS SUBJECT TO, and only that half. Sensitivity is a property of an
# object and Imposition a property of a morphism, so an imposition sits on a step. A
# Conflict is derived from the two and is computed, never asserted. check-conflicts.py
# does the computing.
sensitivities:
  - id: radical-acrylate-polymerization
    to: radical-acrylate-polymerization
    basis: rule
    why: >
      Radical acrylate polymerization is not compatible with a lipid bilayer.
  - id: dmso
    to: dmso
    basis: rule
    why: >
      DMSO ruins liposome formation. Attempts to make SUVs in it gave poor SUVs.
  - id: lysis
    to: lysis
    basis: rule
    why: >
      A phospholipid bilayer is what a lysis effector hydrolyzes. Any member in a
      compartment reached by something that implements Lysis is broken, which is why
      the scope of that imposition is the compartment rather than any one membrane.
      Declared on the class because it follows from the bilayer rather than from any
      member's composition.
