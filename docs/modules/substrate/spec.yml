# Composition source for Substrate.
#
# WRITTEN 2026-10-05 under T2. The class is the payload, not the thing that carries it:
# `signature.md:127` abbreviates `SubstrateCarrier := Vesicle{Substrate}`, so the
# carrier is a Vesicle and this is what fills it.
#
# THE SENSITIVITY IS WHY THIS CLASS EARNS A PAGE. ../substrate-cprg declares
# `uv-exposure` with `basis: rule`. ../substrate-xgal declares the same thing with
# `basis: inferred` and `from: substrate-cprg`, because nobody has tested X-Gal and the
# only honest declarations available were a false `rule` or silence.
#
# DECLARED ONCE HERE, THE INFERENCE DISSOLVES. A chromogenic substrate bleaches because
# it is a chromophore, which is a fact about the kind. The member no longer leans on its
# sibling; it inherits from the class. That is the same move ../protein/spec.yml made
# with proteinase-k, and it is the second instance of the pattern rather than the first.
#
# WHAT IS NOT CLAIMED: that every member bleaches at the same rate, or that the bound is
# the same. The class says the kind is sensitive. A member that measures a threshold
# narrows it.

module: substrate
title: "Substrate"

inputs: {}
process_steps: []

sensitivities:
  - id: uv-exposure
    to: uv-exposure
    basis: rule
    why: >
      A chromogenic substrate is a chromophore, and a chromophore bleaches under the UV
      a 405 nm photopatterning source emits. The mechanism is the thing that makes the
      substrate work, so it holds for every member rather than for the ones tested.
    page: spec.md
