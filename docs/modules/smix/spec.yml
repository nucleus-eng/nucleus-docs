process_steps:
  - id: make-amino-acid-mix
    process:
      title: "Make Amino Acid Mix"
      page: ../../processes/make-amino-acid-mix/main.md
    operator: mixing
    operands:
      - alanine
      - arginine
      - asparagine
      - aspartic-acid
      - cysteine
      - glutamic-acid
      - glutamine
      - glycine
      - histidine
      - isoleucine
      - leucine
      - lysine
      - methionine
      - phenylalanine
      - proline
      - serine
      - threonine
      - tryptophan
      - tyrosine
      - valine
      - water
    produces:
      id: amino-acid-mix
      title: "Amino Acid Mix"
      page: null
    finals:
      alanine: {value: 3.25, unit: "mM"}
      arginine: {value: 3.25, unit: "mM"}
      asparagine: {value: 3.25, unit: "mM"}
      aspartic-acid: {value: 3.25, unit: "mM"}
      cysteine: {value: 3.25, unit: "mM"}
      glutamic-acid: {value: 3.25, unit: "mM"}
      glutamine: {value: 3.25, unit: "mM"}
      glycine: {value: 3.25, unit: "mM"}
      histidine: {value: 3.25, unit: "mM"}
      isoleucine: {value: 3.25, unit: "mM"}
      leucine: {value: 3.25, unit: "mM"}
      lysine: {value: 3.25, unit: "mM"}
      methionine: {value: 3.25, unit: "mM"}
      phenylalanine: {value: 3.25, unit: "mM"}
      proline: {value: 3.25, unit: "mM"}
      serine: {value: 3.25, unit: "mM"}
      threonine: {value: 3.25, unit: "mM"}
      tryptophan: {value: 3.25, unit: "mM"}
      tyrosine: {value: 3.25, unit: "mM"}
      valine: {value: 3.25, unit: "mM"}
    balance: water
    notes: >
      Equimolar. Nineteen amino acids are added from stock solutions and
      tyrosine is weighed straight into the final volume, so tyrosine has no
      stock. The stock concentrations and volumes are in the Amino Acid Mix
      worksheet on the process page.

  - id: make-smix
    process:
      title: "Make Small Molecule Mix"
      page: ../../processes/make-small-molecule-mix/main.md
    operator: mixing
    operands:
      - hepes
      - potassium-glutamate
      - magnesium-acetate
      - ratp
      - rgtp
      - rctp
      - rutp
      - amino-acid-mix
      - creatine-phosphate
      - tcep
      - folinic-acid
      - spermidine
      - water
    produces:
      id: smix
      title: "Small Molecule Mix (SMix)"
      page: ../smix/spec.md
    concentration: {value: 3.33, unit: "fold", approx: true, note: "3 uL of SMix per 10 uL of reaction"}
    finals:
      hepes: {value: 166.67, unit: "mM"}
      potassium-glutamate: {value: 333.33, unit: "mM"}
      magnesium-acetate: {value: 25, unit: "mM"}
      ratp: {value: 6.67, unit: "mM"}
      rgtp: {value: 6.67, unit: "mM"}
      rctp: {value: 3.33, unit: "mM"}
      rutp: {value: 3.33, unit: "mM"}
      creatine-phosphate: {value: 66.67, unit: "mM"}
      tcep: {value: 3.33, unit: "mM"}
      folinic-acid: {value: 0.067, unit: "mM"}
      spermidine: {value: 6.67, unit: "mM"}
    fractions:
      hepes: 0.16667
      potassium-glutamate: 0.13333
      magnesium-acetate: 0.025
      ratp: 0.06667
      rgtp: 0.06667
      rctp: 0.03333
      rutp: 0.03333
      creatine-phosphate: 0.13333
      tcep: 0.00667
      folinic-acid: 0.01333
      spermidine: 0.01333
      amino-acid-mix: 0.30769
    balance: water
    notes: >
      SMix is a 3.33x concentration of the small molecules in Base Cytosol:
      3 uL of SMix go into each 10 uL reaction. Each fraction is the SMix
      concentration over the stock concentration, and reproduces the volumes
      Make Small Molecule Mix gives for 500 uL at the stocks on that page.
      Amino Acid Mix at 0.30769 puts each amino acid at 1.00 mM. The fractions
      sum to 0.9994, which leaves about 0.3 uL of water in 500 uL.
