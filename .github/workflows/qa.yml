name: QA Checks

on:
  pull_request:
    branches: [main]

jobs:
  vale:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: "3.14.2"
    steps:
      - uses: actions/checkout@v4

      - name: Install Vale
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar xz -C /usr/local/bin vale

      - name: Run Vale
        run: git ls-files docs/ | grep -E '\.(md|csv)$' | xargs vale

  dropdowns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check empty dropdowns
        run: python3 scripts/check-dropdowns.py

  file-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check file placement
        run: python3 scripts/check-file-placement.py

  toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Check TOC
        run: python3 scripts/check-toc.py


  composition:
    # The prose `# Constituent Modules` list and the machine-readable `spec.yml`
    # are two sources for one fact, and they drift: `london-cascade` listed
    # `Substrate: CPRG` where its own source said `GUV: CPRG`, within an hour of
    # both existing. Blocks when the prose names a module the source never does;
    # reports without blocking when the final step has an operand the prose
    # omits, which is a grain difference. See scripts/check-composition.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Check composition sources
        run: python3 scripts/check-composition.py

  generated-diagrams:
    # A generated diagram must match the source it was drawn from. Nothing checked
    # that, so a `spec.yml` change that left the rendered diagram behind was
    # invisible until somebody regenerated by hand. `render-all.py --check` writes
    # nothing: it renders each artifact and compares it with what is on the page.
    #
    # WHAT IT COVERS HERE, MEASURED RATHER THAN CLAIMED. Three composition
    # diagrams and zero position lines: this branch has 12 sources, nine of whose
    # pages carry no diagram markers, and no source here declares `refines:`. The
    # job is thin on purpose and grows with the corpus. It reports both
    # denominators every run, so a branch checking three never reads as a branch
    # checking everything.
    #
    # TWO OF THE FOUR GENERATORS ARE NOT ON THIS BRANCH. `render-meet.py` needs
    # cascades and `render-posets.py` needs a refinement forest, and neither is
    # here yet. The driver names them as absent rather than skipping them
    # silently. See scripts/render-all.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Check every generated diagram against its source
        run: python3 scripts/render-all.py --check

  input-aliases:
    # An `inputs` key is an identity, and two keys resolving to one page are one
    # material under two names. Nothing compared them until 2026-09-21, when
    # identifying the Chicago agarose as ULGA turned a gap into a duplicate: the
    # corpus got worse by getting more correct and no check noticed either event.
    # Advisory, and it prints the denominator because most keys carry page: null
    # and cannot collide yet. See scripts/check-input-aliases.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check input aliases
        run: python3 scripts/check-input-aliases.py

  conflicts:
    # Layer C, all four rows. #T20 Requirement is a step's `requires` and is
    # checked for reachability; #T21 and #T22 are declared on their carriers;
    # #T23 Conflict is computed from the last two. None of the twelve sources
    # here declares any of them, so every figure prints zero.
    #
    # A Conflict is DERIVED, not asserted. compositional-biology-theory
    # glossary.md#T23: "Sensitivity meeting imposition. Computed, never asserted",
    # with "incompatibility (as a stated fact)" as the refused spelling. #T21 puts
    # Sensitivity on an object, so it is a Module's `sensitivities`. #T22 puts
    # Imposition on a morphism, so it is a step's `impositions`. This walks every
    # step and computes where the two meet.
    #
    # IT PRINTS ZEROS ON THIS BRANCH AND IT IS HERE ANYWAY. None of these twelve
    # sources declares either half, checked module by module rather than assumed,
    # and none of their constraint-shaped prose is a design constraint: they are
    # evidence gaps and result descriptions. So the job reports "12 sources, 0
    # declaring" until the rest of the corpus arrives.
    #
    # The alternative was shipping the schema key and the script to main with
    # nothing running them, which is what this branch did until 2026-09-21. A
    # checker nobody runs is decoration, and the denominator it prints is the
    # honest state rather than a pass: an undeclared Module makes no claim to have
    # no sensitivity. See scripts/check-conflicts.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Compute conflicts
        run: python3 scripts/check-conflicts.py

  spec-schema:
    # The spec.yml files are the machine-readable half of every Module page and
    # nothing validated them in CI on any branch until this job existed -- the
    # checker was written, kept passing, and only ever ran when someone typed it.
    # Two passes: shape against scripts/spec-yml-schema.yml, then the references a
    # schema cannot express -- the module key matching its directory, operands
    # naming something, no two steps producing one id, and every page path
    # resolving. It does NOT compare figures against the page; see the PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install pyyaml jsonschema

      - name: Check spec.yml against the schema
        run: python3 scripts/check-spec-schema.py

  implementations:
    # Two rules over `# Implementations`. CATEGORY (blocking): an entry there
    # must point at docs/implementations/, not at another Module — a cascade is
    # a Module however composed it is. COVERAGE (advisory): an Implementation
    # names the Modules it is built from, and each should link back. Coverage is
    # the half that rots, so it is reported but does not fail; add --strict to
    # enforce it. See scripts/check-implementations.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Implementations sections
        run: python3 scripts/check-implementations.py
