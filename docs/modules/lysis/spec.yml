# Composition source for Lysis.
#
# PLA1 implements lysis, and lysis imposes on modules in the same compartment. So the
# imposition is not PLA1's. Lysis is the thing that imposes and PLA1 is an
# implementation of it.
#
# THE IMPOSITION IS DECLARED HERE, which needed a class-level `impositions` key. As a
# class, all members impose lysis, so there is a class-level imposition. `impositions`
# was a step-only key, on #T22's reading that an imposition belongs to a morphism.
#
# AND IT IS NOT AN EXCEPTION TO #T22, WHICH IS A BETTER ARGUMENT THAN THE ONE THIS FILE
# FIRST GAVE. A class page's job is to hold the guard. No member page can hold it,
# because the guard belongs to the operation rather than to any member. And a Guard is
# "a condition an operation IMPOSES on what it acts upon" -- the vocabulary already
# uses the verb.
#
# So a guard and an imposition are one shape seen from the operation. A class is
# asserted by declaring an operation; Lysis declares `lyse`; the imposition belongs to
# `lyse`. Declaring it on the class page IS declaring it on the morphism, which is #T22
# rather than a carve-out from it.
#
# The weaker first version read: the class says what the Function MEANS, the step says
# WHEN it happened. True, but it left #T22 looking stretched. It is not.
#
# SCOPE IS THE COMPARTMENT, NOT THE MEMBRANE, and that is the sentence the class exists
# to hold. A member does not distinguish the membrane that produced it from a
# neighbor's.
#
# ONE MEMBER TODAY. The class is still worth a page: it is where the imposition's scope
# is written down -- the compartment, not the membrane -- and that sentence belongs to
# the kind rather than to the enzyme.

module: lysis
title: "Lysis"

inputs: {}
process_steps: []

impositions:
  - id: lysis
    why: >
      Every member breaks phospholipid membranes in reach. The scope is the compartment
      rather than any one membrane, because a member cannot distinguish the membrane
      that produced it from a neighbor's.
    page: spec.md
