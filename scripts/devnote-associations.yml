# Manual DevNote <-> Module/Process/Implementation mapping.
#
# Built by reviewing every published DevNote (nucleus-core and other
# collections) by hand with the "Module x DevNote Map" tool -- a Claude
# artifact, not checked in here -- because most DevNotes have no DOI yet
# to cite from a spec page, and most do not link back to their docs page
# either, so neither automatic signal catches them.
#
# Keyed by the DevNote's Curvenote slug (stable; titles get edited).
# `skipped: true` means a human reviewed it and found no match -- keep
# the record so a future pass does not start over from zero.
#
# Consumers:
#   scripts/build-devnote-counts.py  -- the DevNotes column on docs/modules/modules-main.md
#   scripts/build-devnote-cards.py   -- the "# Supported by" section on module/process/implementation pages
#
# After editing this file by hand, re-run both scripts for the affected pages.

# A DevNote's own content can link to a docs page in passing (e.g. citing a
# process as a methods step) without that page being something the DevNote
# demonstrates or validates. `build-devnote-cards.py`'s live backlink
# detection can't tell the difference; this list overrides it for a
# (page, DevNote) pair a human has judged not to belong in that page's
# "# Supported by" section. It does not affect the manual modules/processes/
# implementations tags above, which are already curated.
exclude:
  processes/make-36pot: [01a12d61-686f-7790-8068-f3638be6d7d2]
  processes/make-ribosomes: [01a12d61-686f-7790-8068-f3638be6d7d2]
  processes/make-small-molecule-mix: [01a12d61-686f-7790-8068-f3638be6d7d2]
  processes/make-trna: [01a12d61-686f-7790-8068-f3638be6d7d2]

