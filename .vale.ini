StylesPath = styles
MinAlertLevel = warning

# Two rule sets, and BOTH are now vendored from nucleus-skills. `nucleus` is the 14
# formatting rules; `glossary` is generated from one table there. A rule settles in
# one place and binds everywhere. Severity is each repo's own choice: this is a
# specification corpus and blocks, a DevNote repo is where new vocabulary enters and
# only warns.
#
# Do not edit styles/glossary/*.yml or styles/nucleus/*.yml. For a glossary rule,
# edit the glossary row in nucleus-skills and run its scripts/generate-vale-rules.py.
# For a `nucleus` rule, edit it in nucleus-skills directly. Either way, copy the
# result here and move the pin in the file's own header.
#
# PINS. glossary: see each file's header. nucleus: nucleus-eng/nucleus-skills main
# fb8c87a, which is PR #82 — the merge that made that repo the author of the 14.
# This repo wrote them until 2026-10-09 and the copies were byte-identical at the
# handover, verified file by file before the headers went on.
#
# styles/tests/ and tests/test_vale_fixtures.py STAY HERE as well as moving there.
# They are what catches a bad re-vendor, and a check that lives only upstream cannot
# see a copy that drifted downstream.


# A QUOTED SPAN IS EXEMPT FROM EVERY TERMINOLOGY RULE. This corpus treats a
# quotation as evidence, and rewriting a Node's words
# to satisfy a linter destroys what the quotation was kept for. The alternative was
# an inline suppression comment per instance, which grows by one every time somebody
# quotes a Node again.
#
# It is a span and not a rule exception on purpose: it covers collapses, narrows,
# prefer and prefer-cased at once, and it covers the next rule too.
#
# Known limit 1, measured over all 1292 quoted lines in docs/: 65 carry an odd number
# of quotes, which are quotations wrapped across two lines. The pattern needs both
# marks on one line, so a wrapped quotation is not exempt and can still fire. That is
# the safe direction. Over-suppression would be silent; this is visible.
#
# KNOWN LIMIT 2, AND IT IS THE ONE THAT WILL BITE. TokenIgnores DOES NOT APPLY TO
# *.yml. Vale honours it for markup and skips it for everything else, measured with a
# probe on 2026-09-21: the same quoted line is exempt in a .md and fires in a .yml.
# So a source must NOT restate a quotation. It cites the page that carries it, which
# is what the two cascade sources do and what the substrate sources already did.
# A quotation written into a spec.yml will fail CI at error, and the fix is the
# citation, not an exemption.

[*.md]
BasedOnStyles = nucleus, glossary
TokenIgnores = (\b(?:https?://|www\.)[^\s]+), ("[^"\n]+"|“[^”\n]+”)


# SEVERITY IS THIS REPO'S, NOT THE RULE'S. Each of the 14 `nucleus` rules carried its own
# `level:` line until 2026-10-04, which is the opposite of the convention the generated
# glossary rules state in their own header -- one rule set, each repo choosing how hard it
# binds. A file with `level: error` baked in cannot be vendored into a DevNote repo and run
# at warning there, which is the whole point of the move.
#
# TEN WERE ERRORS AND FOUR WERE WARNINGS, and that split is preserved here rather than
# flattened. The proposal said all 14 were errors; four were not. Promoting them would have
# cost nothing today -- all four report zero findings -- and would have changed a policy
# somebody set on purpose, invisibly.

nucleus.chemical-notation = error
nucleus.degrees-symbol = error
nucleus.house-casing = error
nucleus.ion-charges = error
nucleus.magnitude-unit-spacing = error
nucleus.micro-symbol = error
nucleus.mixture-plus-spacing = error
nucleus.thousands-separator = error
nucleus.unit-spacing = error
nucleus.units = error

nucleus.range-style = warning
nucleus.space-before-degree = warning
nucleus.time-abbreviations = warning
nucleus.time-si-substitution = warning

glossary.prefer = error
glossary.prefer-cased = error

# NO `glossary.narrows`. It refused the bare word "vesicle" and told the author to
# name GUV, SUV or LUV instead. Retired 2026-10-04: vesicle is the umbrella, with
# two independent axes under it — material (liposome, polymersome) and size (GUV,
# SUV, LUV). The rule was right while those three had no pages and the vocabulary
# ran ahead of the tree; they exist now, so an author who means a GUV links to GUV.
# It also refused the one word that fits a sentence about any closed bilayer
# compartment, which is what `encapsulate` returns.

[*.csv]
BasedOnStyles = nucleus
TokenIgnores = (\b(?:https?://|www\.)[^\s]+), ("[^"\n]+"|“[^”\n]+”)

# Prose now lives in spec.yml `note:` and
# `question:` fields, which was invisible to every check before this. This section
# takes the terminology rules ONLY. A spec file is mostly identifiers, part
# numbers and module ids, and the 14 `nucleus` formatting rules aim at sentences,
# so they would fire on structure rather than on prose.
[*.yml]
BasedOnStyles = glossary
TokenIgnores = (\b(?:https?://|www\.)[^\s]+), ("[^"\n]+"|“[^”\n]+”)

glossary.prefer = error
glossary.prefer-cased = error
