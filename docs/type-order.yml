# PUBLISHED FROM compositional-biology-theory. Do not edit.
#
# The type order, which this repo cannot derive: a Module's `type:` names a type,
# and types live in that corpus's signature.md. Generated there by
# scripts/emit-posets.py and copied here at 8f177d1, 2026-10-11.
#
# This is the MIRROR of docs/type-system.posets.yml, which publishes the orders
# THIS repo derives -- module refinement, process refinement, containment -- for
# that corpus to read. Each repo exports what the other cannot compute.
#
# `module_slugs` maps a docs slug to its type: `outer-solution` is `Solution`.
# Run `python3 scripts/emit-posets.py` to refresh and `--check` to verify; guard 12 runs the check.
#
# The refinement orders signature.md states and nucleus-docs cannot read: the type order and the
# Process order. Edges are as STATED, not reduced; an edge a longer path already implies is kept.
# `unparsed` lists every row or profile that mentions a refinement and gave no edge.
