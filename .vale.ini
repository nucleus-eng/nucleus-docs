StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = nucleus, glossary
TokenIgnores = (\b(?:https?://|www\.)[^\s]+)

# Severity for the glossary rules is this repo's call, not the glossary's.
# A refusal that collapses two meanings blocks; a house preference advises.
glossary.collapses = error
glossary.prefer = warning
glossary.prefer-cased = warning

[*.csv]
BasedOnStyles = nucleus
TokenIgnores = (\b(?:https?://|www\.)[^\s]+)