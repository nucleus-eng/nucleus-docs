StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = nucleus, glossary, docs
TokenIgnores = (\b(?:https?://|www\.)[^\s]+), ("[^"\n]+"|“[^”\n]+”)

# Severity for the glossary rules is this repo's call, not the glossary's.
# A house preference advises. The glossary has no Collapses rule today, so none is named here:
# a line naming a kind with no rules is one Vale cannot find, and Vale reports a clean run.
glossary.prefer = warning
glossary.prefer-cased = warning

[*.csv]
BasedOnStyles = nucleus
TokenIgnores = (\b(?:https?://|www\.)[^\s]+)
