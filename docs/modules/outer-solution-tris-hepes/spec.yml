# Composition source for the Outer Solution: Tris-HEPES.
#
# WRITTEN 2026-09-21 with ../outer-solution/spec.yml. Produced by three sources under
# one id, `chicago-outer-solution`, and never given a page. Unlike the London
# formulation it had exactly one name, so no alias to resolve here.
#
# THE AGAROSE DISSOLVES INTO THIS AND BOTH POPULATIONS SIT IN IT, which is why the
# osmolarity below sets the gel's. The polymer's own term is negligible at about 0.7
# percent by weight.

module: outer-solution-tris-hepes
title: "Outer Solution: Tris-HEPES"
refines: outer-solution

inputs:
  tris-hepes-stock:
    title: "Tris-HEPES buffer stock"
    page: null
  energy-solution:
    title: "Energy solution"
    page: null
  water:
    title: "Water"
    page: null

process_steps:
  - id: assemble-outer-solution
    process:
      title: "Assemble Outer Solution"
      page: ../../processes/assemble-outer-solution/main.md
      abstract: assemble-solution
    operator: mixing
    operands: [tris-hepes-stock, energy-solution, water]
    produces:
      id: outer-solution-tris-hepes
      title: "Outer Solution: Tris-HEPES"
      page: ../outer-solution-tris-hepes/spec.md
    # SCALE-FREE. The page's "46.67% (v/v) in water" is already a volume fraction.
    # Keyed by the operand id, `tris-hepes-stock`, rather than by `tris-hepes`. Which
    # Tris-HEPES stock this is, is an open question: see the page.
    fractions:
      tris-hepes-stock: 0.4667
    # The Solutes table on this page: a 2-fold sub-mix, used at 1 fold.
    finals:
      energy-solution: {value: 1, unit: "fold"}
    parameters:
      # A PROPERTY OF THE SOLUTION, not a component of it, so it stays here.
      osmolarity: "~1180 mOsm"
    notes: >
      Osmolarity is additive and this value sets the gel's. It is a relation rather than
      a property of any component, matched across the membranes of the cells embedded in
      it, which is why it stays even though the Tris-HEPES term is also stated.
