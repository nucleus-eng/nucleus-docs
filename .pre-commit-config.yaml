repos:
  - repo: local
    hooks:
      - id: check-dropdowns
        name: Check empty dropdowns
        entry: python3 scripts/check-dropdowns.py
        language: python
        pass_filenames: false
        types: [markdown]

      - id: check-file-placement
        name: Check file placement
        entry: python3 scripts/check-file-placement.py
        language: python
        pass_filenames: false

      - id: check-toc
        name: Check TOC
        entry: python3 scripts/check-toc.py
        language: python
        pass_filenames: false
        additional_dependencies: [pyyaml]

      - id: check-reference-voice
        # Checks only the pages being committed, so touching a page means cleaning it.
        # `types_or` and not `types`: `types` is an AND, so listing both would match
        # nothing. A spec.yml is a docs page's other half and was never checked.
        name: Check reference voice
        entry: python3 scripts/check-reference-voice.py
        language: python
        types_or: [markdown, yaml]
        files: ^docs/
        # GENERATED DATA IS NOT PROSE. type-system.posets.yml is emitted by
        # render-posets.py and its header names the repo it was generated from, which
        # this check reads as pointing into working notes. For a page that is the right
        # complaint; for a generated order it is the provenance the file is required to
        # carry. Added 2026-10-11 with the spec.yml port.
        exclude: ^docs/type-system\.posets\.yml$

      - id: vale
        name: Vale lint
        entry: vale docs/
        language: system
        pass_filenames: false
        types: [markdown]
