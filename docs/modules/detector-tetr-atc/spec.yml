# Composition source for tetR-aTc Detector.
#
# Machine-readable companion to spec.md — see issue #248. The `# Reference
# Composition` tabs stay for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# The step is `mixing`: two additions into Base Cytosol, sharing its resources. No
# `packing` step appears here, so nothing in this file depends on whether forming a
# boundary and holding something in it are one operation, which is unsettled.
#
# aTc IS EXCLUDED. It is the analyte this Module detects, and its dose depends on
# the cytosol rather than on this Module. See ../analyte-atc/spec.md.

module: detector-tetr-atc
title: "tetR-aTc Detector"
type: Detector[repressor]
inputs:
  base-cytosol:
    title: "Base Cytosol"
    page: ../base-cytosol/spec.md
  teto-template:
    title: "pT7-tetO-deGFP template"
    page: null            # pT7-tetO-plamGFP is the PURExpress reference
  tetr:
    title: "TetR repressor"
    range: "500 nM to 2000 nM; 500 nM saturates repression and it is improvable to 2000 nM"
    page: null            # three formats, not interchangeable — see the questions
  detergent-tween-80:
    title: "Detergent: Tween 80"
    page: null
    optional: true        # arrives dissolved in the purified stock, not added
    # NOT A CONSTITUENT ANYBODY CHOSE. The purified His-tagged stock
    # (MedChemExpress HY-P71520A) is lyophilized from a solution containing 0.2 mg/mL
    # Tween 80, so the detergent enters with the repressor. It is declared as an
    # operand because that is the only way the composition can see it, and
    # `optional: true` because the two other formats of TetR do not carry it.
    #
    # THE CONCENTRATION IS NOT HERE BECAUSE NOBODY RECORDED IT. The formulation
    # figure is on ../detergent-tween-80/spec.md, which also says that the
    # reconstitution volume and the dilution into the reaction are unrecorded.

process_steps:
  - id: assemble-reaction
    process:
      title: "Assemble the tetR-aTc Detector reaction"
      page: null
      abstract: assemble-cytosol
    operator: mixing
    operands: [base-cytosol, teto-template, tetr, detergent-tween-80]
    produces:
      id: detector-tetr-atc
      title: "tetR-aTc Detector"
      page: ../detector-tetr-atc/spec.md
    # SCALE-FREE, 2026-10-05, under R36/R37/R38.
    # NO STOCK AND NO FRACTION. ../detector-tetr-atc/spec.md:96 gives these as
    # "Working concentration" in Base Cytosol and states no stock. The page does carry
    # a 10 uM TetR stock at :125, but that is the PURExpress reference build, and this
    # file's own open item `the-reference-figures-used-purexpress` says the specified
    # and the evidenced composition are not the same system. Importing the stock across
    # that line would merge two systems by accident.
    finals:
      base-cytosol: {value: 1, unit: "fold"}
      teto-template: {value: 0.5, unit: "nM"}
      tetr: {value: 500, unit: "nM"}
    notes: >
      TetR binds the tetO operator and blocks transcription until aTc relieves it, so
      the Module is the repressor and its operator-bearing template. The 0.5 nM
      figure is the reporter re-run in Base Cytosol; `pT7-tetO-plamGFP` is the
      PURExpress reference and the master mix that produced the reference figures is
      in Expected Behavior rather than in the composition.

# WHAT THIS MODULE TOLERATES. Half of a Conflict, which is derived and never
# asserted, so the other half sits on a morphism and
# check-conflicts.py does the join. ABSENCE MEANS UNDECLARED, NOT NONE.
sensitivities:
  - id: atc-window
    to: atc-dose
    basis: observation
    bound:
      quantity: concentration
      sense: at-most
      unit: "µM"
      value: 0.5
    why: >
      Above about 0.5 uM aTc in this cytosol the response stops being graded. In the
      Nucleus Base Cytosol titration, 500 nM TetR reads 30 % of the unrepressed level
      at 0.25 uM aTc, 86 % at 1 uM and 91 % at 5 uM; 1000 nM TetR reads 4 %, 63 % and
      88 % at the same doses. Half the unrepressed level falls near 0.4 uM at 500 nM
      TetR and near 0.8 uM at 1000 nM. The plate's lowest non-zero dose is 0.25 uM, so
      this page measures no lower end and asserts none.
      The bound is specific to this cytosol and is not a property of the Detector
      alone: lysate wants 2.5 uM to 5 uM, roughly ten times more.
      It is unverified against the second titration on this page, whose useful range
      runs to 1 uM at either TetR concentration. Read both before relying on it.
open:
  - id: three-tetr-formats-are-not-interchangeable
    question: >
      The page says three TetR formats exist and are not interchangeable, and points
      at Expected Behavior for the difference. The schema has one operand slot, so
      `tetr` above is the role and the format is unstated. Which format a composing
      page gets is therefore not derivable from this file, and the page's own warning
      that they are not interchangeable means the omission changes the result rather
      than only the provenance. Same "one of these" shape as ../detector-ph/spec.yml.
  - id: the-atc-window-is-the-nodes-not-the-figures
    question: >
      The aTc dose used in the figures is unrecorded, and a reader composing this
      Module needs it. Base Cytosol and lysate want different doses, and aTc is
      excluded from the operands above as the analyte, so this file carries no
      figure either way.
  - id: the-reference-figures-used-purexpress
    question: >
      The composition above is in Base Cytosol. The figures the page shows were
      produced in PURExpress with a different master mix, given in Expected Behavior.
      So the specified composition and the evidenced composition are not the same
      system, and this file describes the first.
