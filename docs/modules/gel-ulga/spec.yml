# Composition source for Gel: ULGA.
#
# Machine-readable companion to spec.md — see issue #248. The `# Constituent
# Modules` prose stays for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# Every step here is `mixing`, and that is a claim rather than a default. A gel's
# own composition is polymer plus solvent ending in one phase. `packing` arises
# when a compartment is put INTO a gel, which is a step on the cascade pages, not
# here — so nothing in this file depends on open question O8 in
# compositional-biology-theory, "are formation and hold one operation?".

module: gel-ulga
title: "Gel: ULGA"
refines: gel

inputs:
  ulga-powder:
    title: "Ultra low gelling temperature agarose"
    page: null            # Sigma-Aldrich A5030; A2576 is interchangeable, London Node
  potassium-glutamate:
    title: "Potassium L-glutamate"
    page: null
    component_of: ../../processes/assemble-outer-solution/main.md
  hepes:
    title: "HEPES, pH 7.4"
    page: null
    component_of: ../../processes/assemble-outer-solution/main.md
  glucose:
    title: "Glucose"
    page: null
    component_of: ../../processes/assemble-outer-solution/main.md

process_steps:
  - id: assemble-outer
    process:
      title: "Assemble Outer Solution"
      page: ../../processes/assemble-outer-solution/main.md
    operator: mixing
    operands: [potassium-glutamate, hepes, glucose]
    produces:
      id: london-outer-solution
      title: "London outer solution"
      page: null
    parameters:
      potassium_glutamate: "578 mM"
      hepes: "72 mM, pH 7.4"
      glucose: "300 mM"
      osmolarity: "~920 mOsm"
    notes: >
      The osmolarity is a relation, not a property of any one component: it has to
      match across the membranes of whatever is embedded. It stays here for that
      reason even though each term above is also stated.

  - id: set-thermal
    process:
      title: "Hydrogel Embedding: ULGA"
      page: ../../processes/embed-ulga-hydrogel/main.md
    operator: mixing
    operands: [ulga-powder, london-outer-solution]
    produces:
      id: gel-ulga
      title: "Gel: ULGA"
      page: ../gel-ulga/spec.md
    ratio: "1:1 with the cell suspension, halving the ULGA to its final figure"
    parameters:
      ulga: "1% (w/v) in the prepared solution; 0.5% (w/v) once combined 1:1"
      ulga_working_range: "0.2% to 0.5% in the set gel"
      gel_temperature_window_c: "8 °C gelling to 50 °C melting"
    notes: >
      The ULGA dissolves into the outer solution, not into water, which is why the
      outer solution is a separate step and an operand rather than a parameter.
      The density is a dynamic-range lever: lower gives faster kinetics, higher
      holds a better on-off state. 0.2% immobilizes GUVs.
      gel_temperature_window_c IS THE MATERIAL'S WINDOW AND ITS TWO ENDS ARE
      DIFFERENT QUANTITIES. 8 is a gelling point and 50 is a MELTING point, both
      supplied by Jon on 2026-09-21 from the supplier's materials specification
      page. That is a catalog figure for a nominal product, not a measurement of
      either Node's stock, and the measured gelling point is still an open ask.
      50 IS NOT A TEMPERATURE AT WHICH THE PAYLOAD CAN BE MIXED IN. The window is
      still correct here because the gel is not what forbids 50: the payload is,
      and that is a Requirement the payload imposes on its Container rather than a
      property of this polymer. Jon's ruling: "that's the right range to put on the
      abstract module because the tighter temperature requirements come from the
      biology we put in the gels." So do not narrow this field to record a
      payload's limit. That belongs on the payload's page, pointing here.

open:
  - id: osmolarity-provenance
    question: >
      Is ~920 mOsm measured or calculated? The page records the figure and says
      which it is was never recorded. It is the sum of the stated components, so
      calculated is the likelier reading, and likelier is not a citation.
  - id: ulga-has-no-page
    question: >
      ULGA is an input with no module page, so no constituent page can state its
      figures and they live here by necessity rather than by design. The same is
      true of agarose corpus-wide. That the polymers have no pages is the finding.
