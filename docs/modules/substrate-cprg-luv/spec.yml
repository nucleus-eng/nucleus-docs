# Composition source, drafted from the page.
# `type:` names the module's own type in the published type order.
# Operators: mixing = one compartment; packing = each keeps its own.

module: substrate-cprg-luv
title: "Substrate LUV: CPRG"
type: 'Vesicle[LUV]'

inputs:
  cprg:
    title: "CPRG"
    page: null
  optiprep:
    title: "Optiprep"
    page: null
  tris-hepes-buffer-stock:
    title: "Tris1M-HEPES1.15M buffer stock"
    page: null
  membrane:
    title: "Membrane: POPC / cholesterol / Rhod-PE, 899.1 / 99.9 / 1 mmol/mol"
    page: null
  outer-solution:
    title: "Outer solution: Tris1M-HEPES1.15M buffer stock, 466.7 mL/L"
    page: null

process_steps:
  - id: encapsulate
    process:
      title: "Encapsulation: Freeze-Thaw"
      page: ../../processes/encapsulate-freeze-thaw/main.md
    operator: packing
    operands: [cprg, optiprep, tris-hepes-buffer-stock, membrane, outer-solution]
    produces:
      id: substrate-luv
      title: "Substrate LUV: CPRG"
      page: ./spec.md

open:
  - id: no-functional-type-for-a-substrate-carrier
    kind: choice
    question: >
      The type order has no functional type for a vesicle that holds a substrate until
      lysis. Substrate is a material type, and a substrate carrier is not a type in the
      order. This file names the form, Vesicle[LUV], which says what the Module is shaped like
      and not what it is for. If a functional type is added for this class of Module,
      name it in `type:` and move Vesicle[LUV] to `refines:`.
