repos:
  - repo: local
    hooks:
      - id: check-dropdowns
        name: Check empty dropdowns
        entry: python3 scripts/check-dropdowns.py
        language: python
        pass_filenames: false
        types: [markdown]

      - id: check-file-placement
        name: Check file placement
        entry: python3 scripts/check-file-placement.py
        language: python
        pass_filenames: false

      - id: check-toc
        name: Check TOC
        entry: python3 scripts/check-toc.py
        language: python
        pass_filenames: false
        additional_dependencies: [pyyaml]

      - id: check-step-quantities
        # Runs when a source or the script changes, and reads every source each time.
        name: Check step quantities
        entry: python3 scripts/check-step-quantities.py
        language: python
        pass_filenames: false
        files: (^docs/.*spec\.yml$|^scripts/check-step-quantities\.py$)
        additional_dependencies: [pyyaml, pint]

      - id: check-reference-voice
        # Checks only the pages being committed, so touching a page means cleaning it.
        # `types_or` and not `types`: `types` is an AND, so listing both would match
        # nothing. A spec.yml is a docs page's other half and was never checked.
        name: Check reference voice
        entry: python3 scripts/check-reference-voice.py
        language: python
        types_or: [markdown, yaml]
        files: ^docs/

      - id: vale
        # `--glob='!**/generated/**'` or this hook blocks EVERY markdown commit.
        # Measured 2026-10-07: `vale docs/` exits 1 on 16 errors, every one under a
        # gitignored generated/ path; with the glob it is 0 errors in 289 files.
        #
        # THE CAUSE IS A LOST SUPPRESSION, NOT A BAD ARTIFACT. The flagged strings are
        # vendor product names - "PES Syringe Filter, 0.45um, 30mm" - and four of the
        # five sources already wrap their materials table in
        # `<!-- vale nucleus.magnitude-unit-spacing = NO -->` ... `= YES`, because
        # respacing a catalog entry misquotes it. build-protocols.py does not carry
        # those comments into what it writes. Verified: the flagged line in
        # lysis-sonication-bom.md is byte-identical to its source, and the generated
        # file holds zero suppressions. Somebody already decided these are exempt and
        # the generator loses the decision.
        #
        # So a plausible wrong fix exists - add the suppression to the generated file -
        # and it would diverge the artifact from its source at the next regeneration.
        # The glob is right because it keeps the decision in one place. Teaching
        # build-protocols.py to carry the comments through is the deeper fix.
        name: Vale lint
        entry: vale --glob='!**/generated/**' docs/
        language: system
        pass_filenames: false
        types: [markdown]
