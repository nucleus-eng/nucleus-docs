# Composition source for tetR-aTc Detector.
#
# Machine-readable companion to spec.md — see issue #248. The `# Reference
# Composition` tabs stay for humans; this file is the contract for tooling, and
# scripts/check-composition.py checks the two do not disagree.
#
# Operators.
#   mixing   both at once, in one compartment, sharing its resources
#   packing  both at once, each keeping its own compartment
#
# The step is `mixing`: two additions into Base Cytosol, sharing its resources. No
# `packing` step appears here, so nothing in this file depends on open question O8
# in compositional-biology-theory, "are formation and `hold` one operation?".
#
# aTc IS EXCLUDED. It is the analyte this Module detects, and its dose depends on
# the cytosol rather than on this Module. See ../analyte-atc/spec.md.

module: detector-tetr-atc
title: "tetR-aTc Detector"
refines: abstract-repressor-detector

inputs:
  base-cytosol:
    title: "Base Cytosol"
    page: ../base-cytosol/spec.md
  teto-template:
    title: "T7-tetO-deGFP template"
    page: null            # pT7-tetO-plamGFP is the PURExpress reference
  tetr:
    title: "TetR repressor"
    page: null            # three formats, not interchangeable — see the questions

process_steps:
  - id: assemble-reaction
    process:
      title: "Assemble the tetR-aTc Detector reaction"
      page: null
    operator: mixing
    operands: [base-cytosol, teto-template, tetr]
    produces:
      id: detector-tetr-atc
      title: "tetR-aTc Detector"
      page: ../detector-tetr-atc/spec.md
    parameters:
      base_cytosol: "at reaction concentration"
      teto_template: "0.5 nM"
      tetr: "500 nM — saturates repression; improvable to 2000 nM"
    notes: >
      TetR binds the tetO operator and blocks transcription until aTc relieves it, so
      the Module is the repressor and its operator-bearing template. The 0.5 nM
      figure is the reporter re-run in Base Cytosol; `pT7-tetO-plamGFP` is the
      PURExpress reference and the master mix that produced the reference figures is
      in Expected Behavior rather than in the composition.

open:
  - id: three-tetr-formats-are-not-interchangeable
    question: >
      The page says three TetR formats exist and are not interchangeable, and points
      at Expected Behavior for the difference. The schema has one operand slot, so
      `tetr` above is the role and the format is unstated. Which format a composing
      page gets is therefore not derivable from this file, and the page's own warning
      that they are not interchangeable means the omission changes the result rather
      than only the provenance. Same "one of these" shape as ../detector-ph/spec.yml.
  - id: the-atc-window-is-the-nodes-not-the-figures
    question: >
      The page gives 0.1 uM to 0.5 uM aTc with an optimum near 0.25 to 0.35 uM, and
      states plainly that this is the Node's working window in this cytosol and NOT
      the dose used in the figures, which is unrecorded. Lysate wants 2.5 uM to 5 uM
      — a different cytosol, a different window. aTc is excluded from the operands
      above as the analyte, so this file does not carry either figure, but a reader
      composing this Module needs both facts and they live on ../analyte-atc/spec.md.
  - id: the-reference-figures-used-purexpress
    question: >
      The composition above is in Base Cytosol. The figures the page shows were
      produced in PURExpress with a different master mix, given in Expected Behavior.
      So the specified composition and the evidenced composition are not the same
      system, and this file describes the first.
