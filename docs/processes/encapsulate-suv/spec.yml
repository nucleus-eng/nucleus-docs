# Process source for Encapsulation: Extrusion.
#
# Signature read from the steps that run it, not from the page's prose.
#
# ONE OF THE THREE ROUTES UNDER ../encapsulate. What distinguishes it is extrusion of a hydrated film through a membrane of defined pore size,
# which is a fact about how the boundary closes and not about what ends up inside. All
# three routes share this signature exactly; that is what makes them routes rather than
# different operations.
#
process: encapsulate-suv
title: "Encapsulation: Extrusion"
refines: encapsulate

signature:
  takes:
    - type: membrane
      note: >
        The bilayer that becomes the boundary.
    - type: solution
      note: >
        The inner solution.
    - type: outer-solution
      note: >
        What the product is suspended in.
  produces:
    type: container
    note: >
      A closed compartment with the payload inside.

operator: packing
