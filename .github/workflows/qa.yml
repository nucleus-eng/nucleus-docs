name: QA Checks

on:
  pull_request:
    branches: [main]

jobs:
  vale:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: "3.14.2"
    steps:
      - uses: actions/checkout@v4

      - name: Install Vale
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar xz -C /usr/local/bin vale

      - name: Run Vale
        run: git ls-files docs/ | grep -E '\.(md|csv)$' | xargs vale

  dropdowns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check empty dropdowns
        run: python3 scripts/check-dropdowns.py

  file-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check file placement
        run: python3 scripts/check-file-placement.py

  toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Check TOC
        run: python3 scripts/check-toc.py

  implementations:
    # Two rules over `# Implementations`. CATEGORY (blocking): an entry there
    # must point at docs/implementations/, not at another Module — a cascade is
    # a Module however composed it is. COVERAGE (advisory): an Implementation
    # names the Modules it is built from, and each should link back. Coverage is
    # the half that rots, so it is reported but does not fail; add --strict to
    # enforce it. See scripts/check-implementations.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Implementations sections
        run: python3 scripts/check-implementations.py

  reference-voice:
    # Pages are reference documentation: they describe the Module, not our work
    # on it. ERRORS (blocking): a contributor named as the source of a decision,
    # a ruling, a pointer into our working notes, a stray review tag. WARNINGS
    # (advisory): dates, "this corpus", tooling as the subject, commit hashes.
    # A net for the commonest markers, not the rule; reading finds the rest.
    # See style-guide/conventions.md#what-never-appears.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Test the check
        run: python3 -m pytest tests/test_check_reference_voice.py

      - name: Check reference voice
        # The script defaults to docs/, so scripts/ was never read and 140 findings
        # accumulated there before a hand sweep found them. Name both.
        run: python3 scripts/check-reference-voice.py docs/ scripts/
