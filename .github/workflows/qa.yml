name: QA Checks

on:
  pull_request:
    branches: [main]

jobs:
  vale:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: "3.24.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Vale
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar xz -C /usr/local/bin vale

      - name: Run Vale
        run: git ls-files docs/ | grep -E '\.(md|csv)$' | xargs vale

  dropdowns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check empty dropdowns
        run: python3 scripts/check-dropdowns.py

  file-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check file placement
        run: python3 scripts/check-file-placement.py

  toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Check TOC
        run: python3 scripts/check-toc.py

  implementations:
    # Two rules over `# Implementations`. CATEGORY (blocking): an entry there
    # must point at docs/implementations/, not at another Module — a cascade is
    # a Module however composed it is. COVERAGE (advisory): an Implementation
    # names the Modules it is built from, and each should link back. Coverage is
    # the half that rots, so it is reported but does not fail; add --strict to
    # enforce it. See scripts/check-implementations.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Implementations sections
        run: python3 scripts/check-implementations.py

  reference-voice:
    # Pages are reference documentation: they describe the Module, not our work
    # on it. ERRORS (blocking): a contributor named as the source of a decision,
    # a ruling, a pointer into our working notes, a stray review tag. WARNINGS
    # (advisory): dates, "this corpus", tooling as the subject, commit hashes.
    # A net for the commonest markers, not the rule; reading finds the rest.
    # See style-guide/conventions.md#what-never-appears.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Test the check
        run: python3 -m pytest tests/test_check_reference_voice.py

      - name: Check reference voice
        run: python3 scripts/check-reference-voice.py

  spec-schema:
    # Does every docs/modules/*/spec.yml match scripts/spec-yml-schema.yml, and do
    # its `type:` and `refines:` values name nodes of the PUBLISHED type order?
    #
    # NOTHING RAN THIS UNTIL 2026-10-12. No spec.yml on main had ever been checked
    # by CI, and the checker was passing for a reason that was not the check: it
    # resolved `refines:` against docs/type-system.posets.yml, a file generated
    # from the very values it was validating, so a typo invented its own node and
    # passed. It could reject something new and never anything already committed.
    # Both halves are fixed; this is what makes the fix hold.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Check module sources
        run: python3 scripts/check-spec-schema.py

  process-schema:
    # The same for docs/processes/*/spec.yml, against scripts/process-yml-schema.yml.
    #
    # Its unknown-parent check was a warning "UNTIL `make` AND `assay` ARE RULED ON",
    # which meant it could not reject a misspelled parent at all. Jon ruled on
    # 2026-10-12, the count reached zero, and it fails again. Wiring it in is what
    # keeps the count there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Test the shared order loader
        run: |
          pip install pytest
          python3 -m pytest scripts/tests/test_orders.py -q

      - name: Check process sources
        run: python3 scripts/check-process-schema.py

  composition-diagrams:
    # Every page with a `gen:composition-diagram` block must match a fresh render
    # of its spec.yml. render-composition.py --check exits 1 on a stale block and
    # writes nothing. Before this ran, two committed diagrams drifted from their
    # sources unnoticed until a regeneration found them (fixed in #308).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check generated composition diagrams
        run: |
          status=0
          pages=$(grep -rl 'gen:composition-diagram' docs --include=spec.md)
          if [ -z "$pages" ]; then
            echo "No page carries a gen:composition-diagram block; nothing checked."
            exit 1
          fi
          for page in $pages; do
            python3 scripts/render-composition.py "${page%spec.md}spec.yml" --check || status=1
          done
          exit $status
