# Composition source for Small Molecule Mix (SMix).
#
# Machine-readable companion to spec.md. ../base-cytosol/spec.yml names this
# Module as its `smix` input, so a cascade rendered at `--depth 2` or deeper
# can expand Base Cytosol down to each small molecule.
#
# Two steps, one per process page: the 20 amino acids are made into Amino Acid
# Mix first, and SMix then takes that mix as one reagent. Walking the two steps
# gives each amino acid its own concentration in SMix.
#
# Stocks and molar masses are those of Make Small Molecule Mix, and the amino
# acid molar masses those of the Amino Acid Mix worksheet on Make Amino Acid
# Mix. Each is the formula weight of the form that is weighed out, which for
# several reagents is a salt or a hydrate.

