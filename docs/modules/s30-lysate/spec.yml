module: s30-lysate
title: "S30 Lysate"

inputs:
  s30-premix:
    title: "S30 premix"
    page: null
    component_of: "Promega E. coli S30 Extract System for Circular DNA, L1020"
  s30-extract:
    title: "S30 extract"
    page: null
    component_of: "Promega E. coli S30 Extract System for Circular DNA, L1020"
  amino-acid-mix:
    title: "Amino acid mix (pooled)"
    page: null
    component_of: "Promega E. coli S30 Extract System for Circular DNA, L1020"
  rnase-inhibitor:
    title: "RNase inhibitor"
    page: null

process_steps:
  - id: assemble-s30-lysate
    process:
      title: "Assemble S30 Lysate"
      page: null
      abstract: assemble-cytosol
    operator: mixing
    operands: [s30-premix, s30-extract, amino-acid-mix, rnase-inhibitor]
    produces:
      id: s30-lysate
      title: "S30 Lysate"
      page: ../s30-lysate/spec.md
    headroom:
      provides: "3.75 uL of 25"
      balance: "Nuclease-free water, to 25"
      notes: >
        The four kit and inhibitor volumes come to 21.25 uL and water makes the
        reaction up to 25 uL. The slot is implied by the total rather than named,
        and a DNA template spends part of it.
    notes: >
      The kit is supplied premixed rather than formulated from individual
      reagents, so the three kit components have no pages of their own.

# WHAT THIS MODULE IS SUBJECT TO, and only that half. glossary.md#T21 makes
# Sensitivity a property of an object; #T22 makes Imposition a property of a
# morphism, so it sits on a step. #T23 makes Conflict DERIVED from the two,
# "computed, never asserted". check-conflicts.py does the computing.
sensitivities:
  - id: optiprep-above-5-percent
    to: optiprep-above-5-percent
    basis: rule
    why: >
      Not compatible with Optiprep in the inner solution above about 5 percent. Use sucrose
      for density matching instead.
