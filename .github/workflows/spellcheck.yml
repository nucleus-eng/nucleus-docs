name: Spell Check

on:
  pull_request:
    branches: [main]

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install codespell
        run: pip install codespell

      - name: Run codespell
        # docs/ alone left scripts/, guides/ and templates/ unchecked, which is how
        # six British spellings sat on main unseen. about/ and LICENSE.md are left
        # out on purpose: the OpenMTA and the licence are verbatim legal text and
        # their spelling is not ours to change.
        run: codespell docs/ scripts/ guides/ templates/ style-guide/ CLAUDE.md STYLE-GUIDE.md
