# Process source for Assay.
#
# WRITTEN 2026-10-05 on Jon's ruling that Colorimetric Readout, Pierce660 and Protein
# Gel all refine one abstract, and that the thing they emit is an Observation.
#
# ../make/spec.yml ASKED FOR THIS FILE BY NAME AND SAID WHY IT WAS NOT WRITTEN. Its open
# entry `observe-is-the-other-missing-abstract-and-is-not-written` records three
# processes sharing a signature with no parent, and gives one reason for waiting: three
# repos called the output three different things, so an abstract written then would have
# inherited whichever word happened to be picked. The word is settled now, so the
# reason to wait is gone and the entry is closed.
#
# IT IS A FOURTH ROOT AND DECLARES NO `refines:`. ../make, ../encapsulate and
# ../embed-gel are the other three. An assay is not a kind of making: nothing it
# produces goes back into a tube.
#
# NO `operator:`. The three instances declare none either. An assay does not compose
# two things into a third, so no operator of the alphabet applies to it. Left undeclared
# rather than forced.
#
# NO `conserves:`. It varies across the instances and absence is not a claim.
# ../pierce660 is destructive, because the Pierce 660 reagent reacts with the protein it
# measures. ../protein-gel consumes its sample into the gel. ../colorimetric-readout
# declares nothing. A parent asserting one answer would be wrong for at least one child.

process: assay
title: "Assay"

signature:
  takes:
    - type: component
      repeated: true
      note: >
        Whatever is being read. Repeated because ../colorimetric-readout takes two, a
        cascade and the substrate it turns over, and the other two take one sample.
  produces:
    type: observation
    note: >
      WHAT THE INSTANCE IS READ TO LEARN, AND NOT A COMPONENT. Nothing an assay produces
      can be put in the next tube, which is what separates this root from ../make.
      AN OBSERVATION MAY BE QUANTITATIVE OR QUALITATIVE, and a Measurement is the
      quantitative case refining it. ../pierce660 narrows to `measurement`: a standard
      curve, a linear fit, and a concentration calculated from it. ../protein-gel and
      ../colorimetric-readout stay at this type, because each has a route read by eye.
      `observation` HAS NO PAGE, LIKE `component`, WHICH 27 SIGNATURES NAME AND NO
      MODULE CARRIES. A Module is a formulation. A reading is not one.

open:
  - id: the-domain-is-the-loosest-of-the-three
    question: >
      `component` repeated covers all three instances and says almost nothing.
      ../colorimetric-readout actually takes a cascade and a substrate, and the other
      two take a sample of a mixture. A tighter domain would need a type for "the thing
      an assay is run on", which this corpus does not have and which the shared glossary
      calls a Sample. Left loose rather than invented.
    kind: question
