version: 1
project:
  # open_access: true
  license:
    content: CC-BY-4.0
  abbreviations:
    PURE: protein synthesis using recombinant elements
    GUV: giant unilamellar vesicle
    LUV: large unilamellar vesicle
    SUV: small unilamellar vesicle
site:
  url: https://docs.nucleus.engineering
  # Pinned, not the bare name `book-theme`: that resolves against the
  # unpinned tip of the theme's main branch, which is how a theme release
  # with no change in this repo hung every deploy (see #345). mystmd@1.9.1
  # (pinned in deploy.yml, protocols.yml and setup.sh) supports theme
  # versions through 1.4.1; pin to that release until mystmd is upgraded.
  template: https://github.com/jupyter-book/myst-theme/releases/download/myst-to-react%401.4.1/book-theme.zip
  nav:
    - title: Documentation
      url: https://docs.nucleus.engineering/
    - title: Developer Notes
      url: https://devnotes.nucleus.engineering/
    - title: Contribute
      url: /start/contribute
    # - title: Help
    #   children:
    #   - title: Forum
    #     url: https://nucleus.discourse.group/
    #   - title: FAQs
    #     url: /docs/about/faqs
  options:
    analytics_plausible: nucleus.engineering
    logo: assets/logo-v1.png
    logo_url: https://nucleus.engineering/
    style: assets/style-sheet.css
    folders: true
    favicon: favicon.ico
    # favicon: https://raw.githubusercontent.com/jupyter-book/jupyter-book/refs/heads/next/docs/media/images/favicon.ico
    # logo_dark: https://raw.githubusercontent.com/jupyter-book/jupyter-book/refs/heads/next/docs/media/images/logo-dark.svg