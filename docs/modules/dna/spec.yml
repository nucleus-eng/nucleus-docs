# Composition source for DNA.
#
# WRITTEN 2026-10-05 under T2, and it closes an asymmetry rather than adding a class for
# its own sake. ../reporter-lacz-enzyme refines `[lacz, protein]`. ../lacz-dna refined
# `lacz` and nothing else, because the kind it belongs to had no page. The trio --
# the DNA, the protein, and the meet that abstracts over both -- was two thirds built.
#
# THE MEET IS A MODULE AND NOT A THIRD CLASS. compositional-biology-theory
# `signature.md:834` lists `lacz` among `refines:` parents that are NOT types: "one
# identity with two supply forms". DNA and Protein have rows there and are types. So
# this page and ../protein/spec.yml are the classes, ../lacz/spec.yml stays a Module,
# and the pattern repeats per molecule without a class page per molecule.
#
# GROUNDED BY COMPOSITION, as ../protein/spec.yml is. Members share what they are made
# of, a nucleic acid polymer, and not what they encode.
#
# `inputs: {}` AND `process_steps: []` ARE CLAIMS. Nothing in this corpus produces a
# DNA molecule as a step; templates are supplied.
#
# NO SENSITIVITY DECLARED, DELIBERATELY. ../protein/spec.yml earns one because
# proteinase-k is attested against a member and the mechanism generalises. The obvious
# counterpart here is a nuclease, and no member declares one: the corpus's RNase
# inhibitor protects transcripts rather than templates, so writing a DNase sensitivity
# would be inventing the evidence rather than recording it.

module: dna
title: "DNA"

inputs: {}
process_steps: []

# STRANDEDNESS HAS A DEFAULT AND SILENCE MEANS DOUBLE. Jon, 2026-10-05: "basically all
# DNA that isn't explicitly ssDNA is double stranded." ../dsdna and ../ssdna both refine
# this class, and they are not symmetric in what a page must say: a member that declares
# nothing is double-stranded, and single-stranded is the case that must be declared.
#
# THAT CHANGES HOW A SILENT PAGE READS. ../lacz-dna says "template" and never says how
# many strands. The first pass read that as an absence of evidence and left it on this
# class rather than assigning one. It is not an absence -- it is the default, and
# ../lacz-dna now refines ../dsdna.
